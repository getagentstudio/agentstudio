name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SWIFT_BUILD_DIR: .build-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        id: select-xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"

      - name: Setup mise
        uses: jdx/mise-action@v3

      # --- Import Apple Developer ID certificate via official Apple action ---

      - name: Import code signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Determine signing identity
        id: signing
        run: |
          # Dynamically discover the Developer ID identity from the keychain
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')

          if [ -n "$IDENTITY" ]; then
            echo "Found signing identity: $IDENTITY"
            echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Developer ID Application certificate found — falling back to ad-hoc signing"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Submodule commit SHAs (cache keys) ---

      - name: Get submodule SHAs
        id: submodules
        run: |
          GHOSTTY_SHA=$(git -C vendor/ghostty rev-parse HEAD)
          ZMX_SHA=$(git -C vendor/zmx rev-parse HEAD)
          echo "ghostty_sha=$GHOSTTY_SHA" >> "$GITHUB_OUTPUT"
          echo "zmx_sha=$ZMX_SHA" >> "$GITHUB_OUTPUT"
          echo "Ghostty: $GHOSTTY_SHA"
          echo "zmx: $ZMX_SHA"

      # --- Artifact caches (skip zig builds on hit) ---

      - name: Cache Ghostty artifacts
        id: cache-ghostty
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/ghostty/macos/GhosttyKit.xcframework
            vendor/ghostty/zig-out/share
          key: ghostty-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}

      - name: Cache zmx artifacts
        id: cache-zmx
        uses: actions/cache/restore@v4
        with:
          path: vendor/zmx/zig-out
          key: zmx-${{ runner.os }}-${{ steps.submodules.outputs.zmx_sha }}

      # --- Zig compilation cache (speeds up builds on cache miss) ---
      # Following Ghostty's pattern: explicit cache dirs for zig internals

      - name: Cache Zig compilation
        if: steps.cache-ghostty.outputs.cache-hit != 'true' || steps.cache-zmx.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/zig
            vendor/ghostty/.zig-cache
            vendor/zmx/.zig-cache
          key: zig-compile-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}-${{ steps.submodules.outputs.zmx_sha }}
          restore-keys: |
            zig-compile-${{ runner.os }}-

      # --- Build Ghostty (only on cache miss) ---

      - name: Build Ghostty XCFramework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: |
          cd vendor/ghostty
          zig build -Doptimize=ReleaseFast -Demit-xcframework=true -Demit-macos-app=false -Dxcframework-target=native

      # --- Build zmx (only on cache miss) ---

      - name: Build zmx
        if: steps.cache-zmx.outputs.cache-hit != 'true'
        run: |
          mise run --skip-deps build-zmx

      # --- Always: copy framework, setup resources, build Swift, bundle ---

      - name: Copy XCFramework
        run: |
          mise run --skip-deps copy-xcframework

      - name: Setup dev resources
        run: |
          # Shell integration (prefer zig-out, fall back to vendor source)
          if [ -d "vendor/ghostty/zig-out/share/ghostty/shell-integration" ]; then
            SRC="vendor/ghostty/zig-out/share/ghostty/shell-integration"
          elif [ -d "vendor/ghostty/src/shell-integration" ]; then
            SRC="vendor/ghostty/src/shell-integration"
          else
            echo "ERROR: shell-integration not found" && exit 1
          fi
          mkdir -p Sources/AgentStudio/Resources/ghostty
          rm -rf Sources/AgentStudio/Resources/ghostty/shell-integration
          cp -R "$SRC" Sources/AgentStudio/Resources/ghostty/shell-integration

          # Terminfo
          TERMINFO_SRC="vendor/ghostty/zig-out/share/terminfo"
          if [ -d "$TERMINFO_SRC" ]; then
            mkdir -p Sources/AgentStudio/Resources/terminfo/78 Sources/AgentStudio/Resources/terminfo/67
            [ -f "$TERMINFO_SRC/78/xterm-ghostty" ] && cp "$TERMINFO_SRC/78/xterm-ghostty" Sources/AgentStudio/Resources/terminfo/78/
            [ -f "$TERMINFO_SRC/67/ghostty" ] && cp "$TERMINFO_SRC/67/ghostty" Sources/AgentStudio/Resources/terminfo/67/
          fi

      - name: Determine release metadata
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            bash scripts/release-tag-metadata.sh "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "marketing_version=0.0.1-dev" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "cask_token=agent-studio" >> "$GITHUB_OUTPUT"
            echo "cask_file=Casks/agent-studio.rb" >> "$GITHUB_OUTPUT"
            echo "data_dir_name=.agentstudio" >> "$GITHUB_OUTPUT"
            echo "app_bundle_name=AgentStudio.app" >> "$GITHUB_OUTPUT"
            echo "bundle_identifier=com.agentstudio.app" >> "$GITHUB_OUTPUT"
            echo "bundle_name=AgentStudio" >> "$GITHUB_OUTPUT"
            echo "bundle_display_name=Agent Studio" >> "$GITHUB_OUTPUT"
            echo "app_cache_domain=com.agentstudio.app" >> "$GITHUB_OUTPUT"
          fi
          echo "build_version=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node for BridgeWeb
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: BridgeWeb/pnpm-lock.yaml

      - name: Build BridgeWeb packaged resources
        run: |
          mise run bridge-web-build
          test -f Sources/AgentStudio/Resources/BridgeWeb/app/index.html

      - name: Build AgentStudio
        run: |
          set -o pipefail
          mise run --skip-deps build-release

      - name: Create App Bundle
        run: |
          set -euo pipefail
          APP_BUNDLE_NAME="${{ steps.version.outputs.app_bundle_name }}"
          APP_DIR="$APP_BUNDLE_NAME/Contents"
          rm -rf "$APP_BUNDLE_NAME"
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources" "$APP_DIR/Helpers"
          chmod 755 "$APP_DIR/Helpers"
          echo "APP_BUNDLE_NAME=$APP_BUNDLE_NAME" >> "$GITHUB_ENV"

          cp .build-ci/release/AgentStudio "$APP_DIR/MacOS/"
          [ -f "vendor/zmx/zig-out/bin/zmx" ] && cp vendor/zmx/zig-out/bin/zmx "$APP_DIR/MacOS/"

          # agentstudio CLI — bundled as Contents/Helpers/agentstudio because
          # Contents/MacOS/agentstudio collides with the app executable on
          # case-insensitive volumes. The pane environment advertises this path.
          if [ ! -f ".build-ci/release/agentstudio-cli" ]; then
            echo "::error::agentstudio-cli executable not found in .build-ci/release"
            exit 1
          fi
          cp .build-ci/release/agentstudio-cli "$APP_DIR/Helpers/agentstudio"
          chmod 755 "$APP_DIR/Helpers/agentstudio"
          cp Sources/AgentStudio/Resources/Info.plist "$APP_DIR/"
          bash scripts/inject-bundle-version.sh \
            "$APP_DIR/Info.plist" \
            "${{ steps.version.outputs.marketing_version }}" \
            "${{ steps.version.outputs.build_version }}" \
            "${{ steps.version.outputs.channel }}"
          cp Sources/AgentStudio/Resources/AppIcon.icns "$APP_DIR/Resources/"
          [ -d "Sources/AgentStudio/Resources/terminfo" ] && cp -R Sources/AgentStudio/Resources/terminfo "$APP_DIR/Resources/"
          if [ -d "Sources/AgentStudio/Resources/ghostty" ]; then
            mkdir -p "$APP_DIR/Resources/ghostty"
            cp -R Sources/AgentStudio/Resources/ghostty/. "$APP_DIR/Resources/ghostty/"
          fi

          # AgentPackage — provider hooks, installer resources and the model
          # skill. The installer resolves this tree from
          # Contents/Helpers/agentstudio, so this exact path is load-bearing.
          if [ ! -f "Sources/AgentStudio/Resources/AgentPackage/manifest.json" ]; then
            echo "::error::AgentPackage resources not found"
            exit 1
          fi
          mkdir -p "$APP_DIR/Resources/AgentPackage"
          cp -R Sources/AgentStudio/Resources/AgentPackage/. "$APP_DIR/Resources/AgentPackage/"
          find "$APP_DIR/Resources/AgentPackage" -name '*.sh' -exec chmod 755 {} +

          # GhosttyKit is a static library (libghostty.a) — already linked into
          # the AgentStudio binary at build time. Do NOT embed the xcframework
          # in the app bundle; it's only needed at build time for SwiftPM.

          # SwiftPM resource bundle — Bundle.appResources looks in Contents/Resources/
          # Xcode 27's build system makes .build-ci/release a symlink into
          # out/Products/Release, which `find` does not descend without -L, so
          # read the bundle through the same direct path as the binaries above.
          RESOURCE_BUNDLE=".build-ci/release/AgentStudio_AgentStudio.bundle"
          if [ -d "$RESOURCE_BUNDLE" ]; then
            cp -R "$RESOURCE_BUNDLE" "$APP_DIR/Resources/"
          else
            echo "::error::SwiftPM resource bundle not found"
            exit 1
          fi

      # --- Code signing (Developer ID or ad-hoc fallback) ---

      - name: Sign app bundle
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          CAN_SIGN: ${{ steps.signing.outputs.can_sign }}
        run: |
          set -euo pipefail
          ENTITLEMENTS="Sources/AgentStudio/Resources/AgentStudio.entitlements"
          APP="${APP_BUNDLE_NAME:?missing app bundle name}"

          if [ "$CAN_SIGN" = "true" ]; then
            echo "Signing with: $SIGNING_IDENTITY"

            # Sign any embedded dylibs or frameworks (inside-out)
            if [ -d "$APP/Contents/Frameworks" ]; then
              find "$APP/Contents/Frameworks" -type d -name "*.framework" -print0 | while IFS= read -r -d '' item; do
                codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime "$item"
              done
              find "$APP/Contents/Frameworks" -type f -name "*.dylib" -print0 | while IFS= read -r -d '' item; do
                codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime "$item"
              done
            fi

            # Sign zmx helper binary
            if [ -f "$APP/Contents/MacOS/zmx" ]; then
              codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
                --entitlements "$ENTITLEMENTS" "$APP/Contents/MacOS/zmx"
            fi

            # Sign bundled helper executables (inside-out, before the outer app)
            if [ -d "$APP/Contents/Helpers" ]; then
              find "$APP/Contents/Helpers" -type f -perm -u+x -print0 | while IFS= read -r -d '' item; do
                codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
                  --entitlements "$ENTITLEMENTS" "$item"
              done
            fi

            # Sign the main app bundle
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
              --entitlements "$ENTITLEMENTS" "$APP"
          else
            echo "Ad-hoc signing (no Developer ID configured)..."
            codesign --force --deep --sign - "$APP"
          fi

          # Verify
          codesign --verify --deep --strict --verbose "$APP"
          echo "App bundle signed and verified"

      # --- Notarization (only with Developer ID) ---

      - name: Submit app for notarization
        if: steps.signing.outputs.can_sign == 'true'
        id: notarize_submit
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Creating ZIP for notarization..."
          ditto -c -k --keepParent "${APP_BUNDLE_NAME:?missing app bundle name}" AgentStudio-notarize.zip

          echo "Submitting to Apple notary service..."
          SUBMISSION_ID=$(xcrun notarytool submit AgentStudio-notarize.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --output-format json | jq -r '.id // empty')

          if [ -z "$SUBMISSION_ID" ] || [ "$SUBMISSION_ID" = "null" ]; then
            echo "::error::Failed to extract submission ID from notarization response"
            exit 1
          fi

          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"
          echo "Submission ID: $SUBMISSION_ID"

      - name: Wait for notarization
        if: steps.signing.outputs.can_sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          SUBMISSION_ID: ${{ steps.notarize_submit.outputs.submission_id }}
        run: |
          set -euo pipefail

          echo "Waiting for notarization: $SUBMISSION_ID (up to 30m)..."
          if ! xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --timeout 30m; then
            echo "::error::Notarization failed or timed out."

            echo "Current status:"
            xcrun notarytool info "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD" || true

            echo "Fetching notarization log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD" notary-log.json || true
            test -f notary-log.json && cat notary-log.json || true

            exit 1
          fi

      - name: Staple notarization ticket
        if: steps.signing.outputs.can_sign == 'true'
        run: |
          set -euo pipefail
          xcrun stapler staple "${APP_BUNDLE_NAME:?missing app bundle name}"
          spctl --assess --type execute --verbose "${APP_BUNDLE_NAME:?missing app bundle name}"
          rm -f AgentStudio-notarize.zip

      # --- Package and release ---

      - name: Create ZIP Archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ditto -c -k --keepParent "${APP_BUNDLE_NAME:?missing app bundle name}" "AgentStudio-${VERSION}-macos.zip"
          echo "ARTIFACT_NAME=AgentStudio-${VERSION}-macos.zip" >> $GITHUB_ENV

      - name: Compute SHA256
        run: |
          SHA256=$(shasum -a 256 "${{ env.ARTIFACT_NAME }}" | awk '{print $1}')
          echo "SHA256: $SHA256"
          echo "RELEASE_SHA256=$SHA256" >> $GITHUB_ENV

      - name: Upload artifact as backup
        uses: actions/upload-artifact@v4
        with:
          name: AgentStudio-${{ steps.version.outputs.version }}
          path: ${{ env.ARTIFACT_NAME }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          body: |
            **SHA256:** `${{ env.RELEASE_SHA256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # --- Update Homebrew tap ---

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          bash scripts/update-homebrew-tap.sh \
            "${{ steps.version.outputs.channel }}" \
            "${{ steps.version.outputs.version }}" \
            "${{ env.RELEASE_SHA256 }}"
