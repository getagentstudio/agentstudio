name: CI / Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Every base, not only main: a stacked PR targets the branch below it and
  # still has to pass the same gates before the stack merges.
  pull_request:
  # Full cold verification runs nightly; main pushes publish the cold prebuild.
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: "${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The first-attempt gate reads a pull request's live labels.
  issues: read
  pull-requests: write

jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-24.04
    container: swift@sha256:8de8ea332a61e961ead4ef41029c2552b18e1a70dd5942d25ecf7d8de2eec5b5
    defaults:
      run:
        shell: bash
    env:
      SWIFT_BUILD_DIR: .build-ci
      CI_CONTAINER_TOOLS: "1"
      # Lint never uses zig; keep mise from auto-installing it on `mise run` (its mirror rate-limits).
      MISE_DISABLE_TOOLS: zig

    steps:
      # First step of every job, before checkout: a re-run attempt fails here unless
      # its pull request carries the ci-rerun-approved label right now. A red run is
      # diagnosed, not re-run. Labels are read live because a re-run replays the
      # original event payload. Defined once here; every other job starts with its alias.
      - &first-attempt-gate
        name: First-attempt gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          override_label=ci-rerun-approved
          if [ "$RUN_ATTEMPT" -le 1 ]; then
            echo "first-attempt gate: attempt $RUN_ATTEMPT, nothing to check"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "${PULL_REQUEST_NUMBER:-}" ]; then
            echo "::error::Re-run attempt $RUN_ATTEMPT of a $EVENT_NAME run is refused: only a pull request carrying the '$override_label' label may be re-run. Diagnose the red run and start a new one instead."
            exit 1
          fi
          if [ "${CI_CONTAINER_TOOLS:-}" = "1" ] && ! command -v gh >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gh
          fi
          if ! labels="$(gh api --paginate "repos/$REPOSITORY/issues/$PULL_REQUEST_NUMBER/labels" --jq '.[].name' 2>&1)"; then
            echo "::error::Re-run attempt $RUN_ATTEMPT refused: the labels of PR #$PULL_REQUEST_NUMBER could not be read, and the gate fails closed. $labels"
            exit 1
          fi
          if grep -Fxq -- "$override_label" <<<"$labels"; then
            echo "first-attempt gate: re-run attempt $RUN_ATTEMPT allowed by the '$override_label' label on PR #$PULL_REQUEST_NUMBER"
            exit 0
          fi
          echo "::error::Re-run attempt $RUN_ATTEMPT refused: a red run is diagnosed, not re-run. Add the '$override_label' label to PR #$PULL_REQUEST_NUMBER to allow this re-run."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so the debt ledger ratchet can compute the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux CI prerequisites
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends gh jq perl curl lsof
          perl -MJSON::PP -MTime::HiRes -e 1

      - name: Trust checkout for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          # Lint needs only SwiftLint, which the next step installs by exact version.
          # Installing every .mise.toml tool here pulled zig, whose mirror rate-limits (HTTP 429).
          install: false
          # Nothing is installed through mise in this job, so there is nothing to cache.
          cache: false

      - name: Install lint tools
        run: bash scripts/install-ci-lint-tools.sh

      - name: Verify lint tools on PATH
        run: |
          swift-format --version
          swiftlint version

      - name: Restore architecture lint build cache
        id: architecture-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .build-ci/architecture-lint
          key: architecture-lint-linux-${{ runner.arch }}-swift-6.3.3-image-8de8ea332a61-${{ hashFiles('Tools/AgentStudioArchitectureLint/Package.swift', 'Tools/AgentStudioArchitectureLint/Package.resolved') }}
          restore-keys: |
            architecture-lint-linux-${{ runner.arch }}-swift-6.3.3-image-8de8ea332a61-

      - name: AgentStudio architecture lint tool tests
        run: mise run test:architecture

      - name: Save architecture lint build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.architecture-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-ci/architecture-lint
          key: ${{ steps.architecture-cache-restore.outputs.cache-primary-key }}

      - name: Lint
        run: mise run lint:portable

      - name: Debt ledger ratchet
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: /bin/bash Tools/AgentStudioArchitectureLint/check-ledger-ratchet.sh "origin/${BASE_REF}"

  marketing-site-validation:
    name: Marketing site validation
    runs-on: ubuntu-24.04

    steps:
      - *first-attempt-gate

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node for marketing site
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install Google Chrome
        run: |
          npx --yes playwright@1.61.0 install --with-deps chrome
          chrome_binary="$(command -v google-chrome || command -v google-chrome-stable)"
          test -x "$chrome_binary"
          echo "CHROME_BIN=$chrome_binary" >> "$GITHUB_ENV"

      - name: Install marketing site dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run marketing site checks
        run: pnpm --dir web run check

      - name: Build marketing site and Cloudflare package
        run: |
          pnpm --dir web run build
          pnpm --dir web exec cf build
          pnpm --dir web run verify:cloudflare-discovery

  bridge-web:
    name: BridgeWeb
    if: github.event_name != 'push'
    runs-on: macos-26
    env:
      SWIFT_BUILD_DIR: .build-ci
      SWIFT_BUILD_STATS_DIR: ${{ github.workspace }}/tmp/plan-workflows/ci-runs/compiler-stats

    steps:
      - *first-attempt-gate

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        id: select-xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          cache_save: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node for BridgeWeb
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: BridgeWeb/pnpm-lock.yaml

      - name: Get submodule SHAs
        id: submodules
        run: |
          GHOSTTY_SHA=$(git -C vendor/ghostty rev-parse HEAD)
          ZMX_SHA=$(git -C vendor/zmx rev-parse HEAD)
          echo "ghostty_sha=$GHOSTTY_SHA" >> "$GITHUB_OUTPUT"
          echo "zmx_sha=$ZMX_SHA" >> "$GITHUB_OUTPUT"

      - parallel:
          - name: Install BridgeWeb dependencies
            run: pnpm --dir BridgeWeb install --frozen-lockfile

          - name: Cache Zig compilation
            id: cache-zig-compilation
            uses: actions/cache/restore@v4
            with:
              path: |
                ~/.cache/zig
                vendor/ghostty/.zig-cache
                vendor/zmx/.zig-cache
              key: zig-compile-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}-${{ steps.submodules.outputs.zmx_sha }}
              restore-keys: |
                zig-compile-${{ runner.os }}-

          - name: Cache Ghostty artifacts
            id: cache-ghostty
            uses: actions/cache/restore@v4
            with:
              path: |
                vendor/ghostty/macos/GhosttyKit.xcframework
                vendor/ghostty/zig-out/share
              key: ghostty-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}

          - name: Cache zmx artifacts
            id: cache-zmx
            uses: actions/cache/restore@v4
            with:
              path: vendor/zmx/zig-out
              key: zmx-${{ runner.os }}-${{ steps.submodules.outputs.zmx_sha }}

      - name: Verify BridgeWeb fixtures
        run: bash scripts/bridge-web-sync-fixtures.sh

      - name: Run BridgeWeb lanes
        run: |
          # Keep CPU-heavy test lanes sequential on this runner.
          pnpm --dir BridgeWeb run check
          pnpm --dir BridgeWeb run test:unit
          pnpm --dir BridgeWeb run test:browser:integration

      - parallel:
          - name: BridgeWeb packaged build
            run: pnpm --dir BridgeWeb run build

          - name: Build Ghostty XCFramework
            if: steps.cache-ghostty.outputs.cache-hit != 'true'
            run: |
              cd vendor/ghostty
              zig build -Doptimize=ReleaseFast -Demit-xcframework=true -Demit-macos-app=false -Dxcframework-target=native

          - name: Build zmx
            if: steps.cache-zmx.outputs.cache-hit != 'true'
            run: mise run --skip-deps build-zmx

      - name: Verify packaged BridgeWeb build
        run: test -f Sources/AgentStudio/Resources/BridgeWeb/app/index.html

      - parallel:
          - name: Copy XCFramework
            run: mise run --skip-deps copy-xcframework

          - name: Setup dev resources
            run: |
              SHELL_SRC="vendor/ghostty/zig-out/share/ghostty/shell-integration"
              SHELL_DST="Sources/AgentStudio/Resources/ghostty/shell-integration"
              if [ ! -d "$SHELL_DST" ]; then
                mkdir -p "$(dirname "$SHELL_DST")"
                cp -R "$SHELL_SRC" "$SHELL_DST"
              fi
              TERMINFO_SRC="vendor/ghostty/zig-out/share/terminfo"
              TERMINFO_DST="Sources/AgentStudio/Resources/terminfo"
              if [ ! -d "$TERMINFO_DST/78" ]; then
                mkdir -p "$TERMINFO_DST/78" "$TERMINFO_DST/67"
                [ -f "$TERMINFO_SRC/78/xterm-ghostty" ] && cp "$TERMINFO_SRC/78/xterm-ghostty" "$TERMINFO_DST/78/"
                [ -f "$TERMINFO_SRC/67/ghostty" ] && cp "$TERMINFO_SRC/67/ghostty" "$TERMINFO_DST/67/"
              fi

      - &swift-cache-prefix-step
        name: Compute Swift cache compatibility prefix
        id: swift-cache-prefix
        run: |
          mkdir -p "$SWIFT_BUILD_STATS_DIR"
          prefix="$(/bin/bash scripts/ci-swift-build-inputs.sh fingerprint)"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - &swift-cache-restore-start-step
        name: Start Swift cache restore timer
        if: github.event_name == 'pull_request'
        id: swift-cache-restore-start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - &swift-cache-restore-step
        name: Restore Swift build seed
        if: github.event_name == 'pull_request'
        id: swift-cache-restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .build-ci
          key: ${{ steps.swift-cache-prefix.outputs.prefix }}r0-none
          restore-keys: |
            ${{ steps.swift-cache-prefix.outputs.prefix }}

      - &swift-cache-restore-time-step
        name: Record Swift cache restore time
        if: github.event_name == 'pull_request'
        id: swift-cache-restore-time
        run: |
          restore_seconds=$(( $(date +%s) - ${{ steps.swift-cache-restore-start.outputs.epoch }} ))
          echo "restore_seconds=$restore_seconds" >> "$GITHUB_OUTPUT"
          echo "lane-report swift_cache_restore_seconds=$restore_seconds"

      - &swift-cache-inventory-step
        name: Inventory Swift build inputs before prebuild
        id: swift-cache-inventory-before
        env:
          CI_SWIFT_BUILD_PATH: .build-ci
          CI_SWIFT_PRODUCER_COMMIT: ${{ github.sha }}
          CI_SWIFT_PRODUCER_RUN: ${{ github.run_number }}
          CI_SWIFT_PRODUCER_REF: ${{ github.ref }}
        run: |
          inventory_started=$(date +%s)
          mkdir -p tmp/plan-workflows/ci-runs
          if /bin/bash scripts/ci-swift-build-inputs.sh inventory tmp/plan-workflows/ci-runs/swift-inputs-before.json; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = pull_request ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
          echo "inventory_seconds=$(( $(date +%s) - inventory_started ))" >> "$GITHUB_OUTPUT"

      - &swift-cache-verify-step
        name: Verify and restamp PR Swift seed
        if: github.event_name == 'pull_request'
        id: swift-cache-verify
        env:
          CI_SWIFT_BUILD_PATH: .build-ci
        run: |
          restore_seconds="${{ steps.swift-cache-restore-time.outputs.restore_seconds }}"
          echo "restore_seconds=$restore_seconds" >> "$GITHUB_OUTPUT"
          verify_started=$(date +%s)
          disposition="$(/bin/bash scripts/ci-swift-build-inputs.sh verify \
            .build-ci/ci-swift-build-seed.json tmp/plan-workflows/ci-runs/swift-inputs-before.json)"
          verify_seconds=$(( $(date +%s) - verify_started + ${{ steps.swift-cache-inventory-before.outputs.inventory_seconds }} ))
          echo "verify_seconds=$verify_seconds" >> "$GITHUB_OUTPUT"
          echo "lane-report swift_cache_verify_seconds=$verify_seconds"
          stamp_started=$(date +%s)
          if [[ "$disposition" == warm\ * ]]; then
            disposition="$(/bin/bash scripts/ci-swift-build-inputs.sh restamp \
              .build-ci/ci-swift-build-seed.json tmp/plan-workflows/ci-runs/swift-inputs-before.json)"
          fi
          stamp_seconds=$(( $(date +%s) - stamp_started ))
          echo "stamp_seconds=$stamp_seconds" >> "$GITHUB_OUTPUT"
          echo "lane-report swift_cache_stamp_seconds=$stamp_seconds"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
          echo "lane-report swift_cache_disposition=$disposition"
          echo "swift-cache $disposition restore=${restore_seconds}s"

      - name: Build BridgeWeb Swift development backend
        id: bridge-swift-build
        run: |
          build_started=$(date +%s)
          pnpm --dir BridgeWeb run build:swift-dev-server
          build_seconds=$(( $(date +%s) - build_started ))
          echo "build_seconds=$build_seconds" >> "$GITHUB_OUTPUT"
          echo "lane-report bridge_swift_product_build_seconds=$build_seconds"
          echo "BridgeWeb Swift product build: ${build_seconds}s (cold median: 494s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload BridgeWeb Swift cache receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-swift-cache-${{ github.run_id }}
          path: |
            tmp/plan-workflows/ci-runs/swift-inputs-before.json
            tmp/plan-workflows/ci-runs/compiler-stats/**
            .build-ci/ci-swift-build-seed.json
          retention-days: 7
          if-no-files-found: warn

      - name: Test BridgeWeb Swift integration
        run: pnpm --dir BridgeWeb run test:integration:node:prepared

      # The 1,699-item backpressure journey asserts responsiveness (long-task count,
      # annotation ages under a lease) and runs in the post-merge benchmarks workflow, not here.
      - name: Test BridgeWeb Swift E2E
        run: pnpm --dir BridgeWeb run test:e2e:prepared:ordinary

  swift-test-suite:
    name: Swift test suite
    runs-on: macos-26
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      swift_cache_disposition: ${{ steps.swift-cache-final.outputs.disposition }}
      swift_cache_key: ${{ steps.swift-cache-final.outputs.key }}
      swift_cache_run: ${{ github.run_number }}
    env:
      SWIFT_BUILD_DIR: .build-ci
      XCB_EXTRA_ARGS: "--renderer github-actions"
      LANE_EVENT_STREAM_RETAIN_ALWAYS: "1"
      SWIFT_BUILD_STATS_DIR: ${{ github.workspace }}/tmp/plan-workflows/ci-runs/compiler-stats

    steps:
      - *first-attempt-gate

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Select Xcode
        id: select-xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup mise
        uses: jdx/mise-action@v3

      # Setup mise installs the pinned SwiftLint that the contract tests run.
      # No Swift test runs swift-format, so this job does not build it.
      - name: Verify SwiftLint on PATH
        if: github.event_name != 'push'
        run: |
          echo "swiftlint resolves to: $(command -v swiftlint || echo missing)"
          echo "mise pin installs at: $(mise where swiftlint@0.65.1)"
          test "$(swiftlint version)" = "0.65.1"

      # --- Submodule SHAs for cache keys ---

      - name: Get submodule SHAs
        id: submodules
        run: |
          GHOSTTY_SHA=$(git -C vendor/ghostty rev-parse HEAD)
          ZMX_SHA=$(git -C vendor/zmx rev-parse HEAD)
          echo "ghostty_sha=$GHOSTTY_SHA" >> "$GITHUB_OUTPUT"
          echo "zmx_sha=$ZMX_SHA" >> "$GITHUB_OUTPUT"

      # --- Independent BridgeWeb install and vendor cache restores ---

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node for BridgeWeb
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: BridgeWeb/pnpm-lock.yaml

      - parallel:
          - name: Install BridgeWeb dependencies
            id: bridge-web-install
            run: pnpm --dir BridgeWeb install --frozen-lockfile

          - name: Cache Zig compilation
            id: cache-zig-compilation
            uses: actions/cache@v4
            with:
              path: |
                ~/.cache/zig
                vendor/ghostty/.zig-cache
                vendor/zmx/.zig-cache
              key: zig-compile-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}-${{ steps.submodules.outputs.zmx_sha }}
              restore-keys: |
                zig-compile-${{ runner.os }}-

          - name: Cache Ghostty artifacts
            id: cache-ghostty
            uses: actions/cache@v4
            with:
              path: |
                vendor/ghostty/macos/GhosttyKit.xcframework
                vendor/ghostty/zig-out/share
              key: ghostty-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}

          - name: Cache zmx artifacts
            id: cache-zmx
            uses: actions/cache@v4
            with:
              path: vendor/zmx/zig-out
              key: zmx-${{ runner.os }}-${{ steps.submodules.outputs.zmx_sha }}

      # --- Build independent BridgeWeb and vendor artifacts ---

      - parallel:
          - name: BridgeWeb packaged build
            run: pnpm --dir BridgeWeb run build

          - name: Build Ghostty XCFramework
            if: steps.cache-ghostty.outputs.cache-hit != 'true'
            run: |
              cd vendor/ghostty
              zig build -Doptimize=ReleaseFast -Demit-xcframework=true -Demit-macos-app=false -Dxcframework-target=native

          - name: Build zmx
            if: steps.cache-zmx.outputs.cache-hit != 'true'
            run: |
              mise run --skip-deps build-zmx

      # --- Setup resources + build + test (delegated to mise) ---

      - parallel:
          - name: Copy XCFramework
            run: |
              mise run --skip-deps copy-xcframework

          - name: Setup dev resources
            run: |
              SHELL_SRC="vendor/ghostty/zig-out/share/ghostty/shell-integration"
              SHELL_DST="Sources/AgentStudio/Resources/ghostty/shell-integration"
              if [ ! -d "$SHELL_DST" ]; then
                mkdir -p "$(dirname "$SHELL_DST")"
                cp -R "$SHELL_SRC" "$SHELL_DST"
              fi
              TERMINFO_SRC="vendor/ghostty/zig-out/share/terminfo"
              TERMINFO_DST="Sources/AgentStudio/Resources/terminfo"
              if [ ! -d "$TERMINFO_DST/78" ]; then
                mkdir -p "$TERMINFO_DST/78" "$TERMINFO_DST/67"
                [ -f "$TERMINFO_SRC/78/xterm-ghostty" ] && cp "$TERMINFO_SRC/78/xterm-ghostty" "$TERMINFO_DST/78/"
                [ -f "$TERMINFO_SRC/67/ghostty" ] && cp "$TERMINFO_SRC/67/ghostty" "$TERMINFO_DST/67/"
              fi

      - *swift-cache-prefix-step

      - *swift-cache-restore-start-step

      - *swift-cache-restore-step

      - *swift-cache-restore-time-step

      - *swift-cache-inventory-step

      - *swift-cache-verify-step

      - name: Inventory main Swift inputs before cold build
        if: github.event_name != 'pull_request'
        run: |
          test "${{ steps.swift-cache-inventory-before.outputs.valid }}" = true
          test ! -e .build-ci

      - name: Start Swift prebuild timer
        id: swift-prebuild-start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prebuild Swift test bundles
        id: swift-prebuild
        env:
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          SWIFT_TEST_PREBUILD_TIMEOUT_SECONDS: "1200"
        run: mise run --skip-deps test:swift:prebuild

      - name: Record Swift prebuild time
        id: swift-prebuild-time
        run: |
          build_seconds=$(( $(date +%s) - ${{ steps.swift-prebuild-start.outputs.epoch }} ))
          echo "build_seconds=$build_seconds" >> "$GITHUB_OUTPUT"
          echo "lane-report swift_cache_build_seconds=$build_seconds"

      # Publish the completed prebuild before tests can write to its build path.
      # The verified input manifest establishes reuse; test outcomes do not.
      - name: Inventory main Swift inputs after prebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-prebuild.outcome == 'success'
        id: swift-cache-inventory-after
        env:
          CI_SWIFT_BUILD_PATH: .build-ci
          CI_SWIFT_PRODUCER_COMMIT: ${{ github.sha }}
          CI_SWIFT_PRODUCER_RUN: ${{ github.run_number }}
          CI_SWIFT_PRODUCER_REF: ${{ github.ref }}
        run: |
          /bin/bash scripts/ci-swift-build-inputs.sh inventory tmp/plan-workflows/ci-runs/swift-inputs-after.json
          before="$(python3 -c 'import json; value=json.load(open("tmp/plan-workflows/ci-runs/swift-inputs-before.json")); print(value["manifest_digest"], value["fingerprint"])')"
          after="$(python3 -c 'import json; value=json.load(open("tmp/plan-workflows/ci-runs/swift-inputs-after.json")); print(value["manifest_digest"], value["fingerprint"])')"
          if [ "$before" = "$after" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
            echo "lane-report swift_cache_seed_commit=${{ github.sha }}"
            echo "lane-report swift_cache_tested_tree=${{ github.sha }}"
            echo "lane-report swift_cache_changed_swift_inputs=0"
          else
            echo "unchanged=false" >> "$GITHUB_OUTPUT"
            echo "Swift inputs changed during main build; seed publication disabled"
          fi

      - name: Plan main Swift seed publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift-cache-inventory-after.outputs.unchanged == 'true'
        id: swift-publish-plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_API: gh api
        run: |
          key="${{ steps.swift-cache-prefix.outputs.prefix }}r${{ github.run_number }}-${{ github.sha }}"
          cp tmp/plan-workflows/ci-runs/swift-inputs-after.json .build-ci/ci-swift-build-seed.json
          seed_bytes="$(tar -cf - .build-ci | zstd -T0 -q | wc -c | tr -d ' ')"
          if plan="$(/bin/bash scripts/ci-swift-build-cache-publish.sh plan-save "$key" "${{ github.run_number }}" "$seed_bytes")"; then
            {
              echo "disposition=$plan"
              echo "key=$key"
              echo "seed_bytes=$seed_bytes"
            } >> "$GITHUB_OUTPUT"
          else
            echo "disposition=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Save Swift build seed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(steps.swift-publish-plan.outputs.disposition, 'saved ')
        id: swift-cache-save
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .build-ci
          key: ${{ steps.swift-publish-plan.outputs.key }}

      - name: Finalize Swift seed disposition
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: swift-cache-final
        run: |
          planned="${{ steps.swift-publish-plan.outputs.disposition || 'failed' }}"
          if [[ "$planned" == saved\ * ]] && [ "${{ steps.swift-cache-save.outcome }}" != success ]; then
            planned=failed
          fi
          echo "disposition=${planned%% *}" >> "$GITHUB_OUTPUT"
          echo "key=${{ steps.swift-publish-plan.outputs.key }}" >> "$GITHUB_OUTPUT"
          echo "Swift cache publication: $planned"

      - name: Test fast lane
        if: github.event_name != 'push'
        env:
          SWIFT_TEST_SKIP_PREBUILD: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          _XCB_BYPASS: "1"
        run: mise run --skip-deps --raw test:swift:fast

      - name: Test large lane
        if: github.event_name != 'push'
        env:
          SWIFT_TEST_SKIP_PREBUILD: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          _XCB_BYPASS: "1"
        run: mise run --skip-deps --raw test:swift:large

      - name: Test WebKit lane
        if: github.event_name != 'push'
        env:
          # WebKit teardown can crash swiftpm-testing-helper after assertions pass;
          # this lane isolates real WebKit runtime suites, one process each. A crash
          # fails the lane and the receipt names the suite and signal; it is never retried.
          SWIFT_TEST_SKIP_PREBUILD: "1"
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          XCB_EXTRA_ARGS: "--renderer github-actions"
        run: mise run --skip-deps test:swift:webkit

      - name: Verify release-script contract
        if: github.event_name != 'push'
        run: mise run lint:release-scripts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results-*.xml
          if-no-files-found: warn

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-crash-reports-${{ github.run_id }}
          # A test process can die of a signal after its last flushed line, so the
          # job log shows a passing run and then nothing. Traps raised by
          # libdispatch and os_unfair_lock report through os_log rather than
          # stderr, so the .ips "Application Specific Information" field is the
          # only place their reason survives.
          path: |
            ~/Library/Logs/DiagnosticReports/*.ips
            ~/Library/Logs/DiagnosticReports/*.crash
          if-no-files-found: ignore

      - name: Summarize CI timing
        if: always()
        run: /bin/bash scripts/summarize-ci-timing.sh

      - name: Report Swift cache phases
        if: always() && github.event_name == 'pull_request'
        run: |
          phase_report="tmp/plan-workflows/ci-runs/timing-summary.md"
          {
            echo
            echo "## Swift build cache phases"
            echo "Restore: ${{ steps.swift-cache-verify.outputs.restore_seconds || 'unknown' }} s"
            echo "Verify: ${{ steps.swift-cache-verify.outputs.verify_seconds || 'unknown' }} s"
            echo "Stamp: ${{ steps.swift-cache-verify.outputs.stamp_seconds || 'unknown' }} s"
            echo "Build: ${{ steps.swift-prebuild-time.outputs.build_seconds || 'unknown' }} s"
            echo "Seed: ${{ steps.swift-cache-verify.outputs.disposition || 'cold' }}"
          } | tee -a "$phase_report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI timing ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timing-${{ github.run_id }}-swift
          path: |
            tmp/plan-workflows/ci-runs/lane-*.timing.json
            tmp/plan-workflows/ci-runs/lane-*.events.jsonl
            tmp/plan-workflows/ci-runs/compiler-stats/**
            tmp/plan-workflows/ci-runs/timing-summary.md
          retention-days: 7
          if-no-files-found: warn

      - name: Upload wedged-lane event-stream ledgers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-lane-event-streams-${{ github.run_id }}
          # The runner keeps the Swift Testing event stream when a lane times out
          # or a child dies without recording a failure. It is the only
          # authoritative record of which tests started and never ended; the
          # console stream is block-buffered and stops mid-line at a wedge. A
          # timed-out lane also keeps, beside its ledger, a swift-inspect task dump
          # per stuck test process (every suspended task and where it would
          # resume) and the held-step log naming the harness steps never reached.
          path: |
            tmp/plan-workflows/ci-runs/lane-*.events.jsonl
            tmp/plan-workflows/ci-runs/lane-*.task-dump.txt
            tmp/plan-workflows/ci-runs/lane-*.held-steps.log
          if-no-files-found: ignore

  prune-swift-build-cache:
    name: Prune Swift build cache
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.swift-test-suite.outputs.swift_cache_disposition == 'saved' || needs.swift-test-suite.outputs.swift_cache_disposition == 'skipped-budget')
    needs: swift-test-suite
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - *first-attempt-gate
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prune confirmed older main Swift seeds
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CACHE_API: gh api
        run: |
          /bin/bash scripts/ci-swift-build-cache-publish.sh prune \
            "${{ needs.swift-test-suite.outputs.swift_cache_disposition }}" \
            "${{ needs.swift-test-suite.outputs.swift_cache_key }}" \
            "${{ needs.swift-test-suite.outputs.swift_cache_run }}"
