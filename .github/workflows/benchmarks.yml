name: CI / Post-merge Benchmarks

on:
  workflow_dispatch:
  # Nightly run keeps the timing policies (benchmark suites, BridgeWeb stress, large lane)
  # exercised without putting wall-clock gates in the pull-request lanes.
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    runs-on: macos-26
    env:
      SWIFT_BUILD_DIR: .build-ci
      XCB_EXTRA_ARGS: "--renderer github-actions"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        id: select-xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Setup Node for BridgeWeb
        uses: actions/setup-node@v4
        with:
          node-version: "26.5.0"
          cache: pnpm
          cache-dependency-path: BridgeWeb/pnpm-lock.yaml

      - name: Install BridgeWeb dependencies
        run: mise run bridge-web-install

      - name: BridgeWeb Vitest stress tests
        run: mise run test:bridge-web:stress

      - name: Get submodule SHAs
        id: submodules
        run: |
          GHOSTTY_SHA=$(git -C vendor/ghostty rev-parse HEAD)
          ZMX_SHA=$(git -C vendor/zmx rev-parse HEAD)
          echo "ghostty_sha=$GHOSTTY_SHA" >> "$GITHUB_OUTPUT"
          echo "zmx_sha=$ZMX_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache Zig compilation
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            vendor/ghostty/.zig-cache
            vendor/zmx/.zig-cache
          key: benchmark-zig-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}-${{ steps.submodules.outputs.zmx_sha }}
          restore-keys: |
            benchmark-zig-${{ runner.os }}-
            zig-compile-${{ runner.os }}-

      - name: Cache Ghostty artifacts
        id: cache-ghostty
        uses: actions/cache@v4
        with:
          path: |
            vendor/ghostty/macos/GhosttyKit.xcframework
            vendor/ghostty/zig-out/share
          key: ghostty-${{ runner.os }}-${{ steps.submodules.outputs.ghostty_sha }}

      - name: Build Ghostty XCFramework
        if: steps.cache-ghostty.outputs.cache-hit != 'true'
        run: |
          cd vendor/ghostty
          zig build -Doptimize=ReleaseFast -Demit-xcframework=true -Demit-macos-app=false -Dxcframework-target=native

      - name: Cache zmx artifacts
        id: cache-zmx
        uses: actions/cache@v4
        with:
          path: vendor/zmx/zig-out
          key: zmx-${{ runner.os }}-${{ steps.submodules.outputs.zmx_sha }}

      - name: Build zmx
        if: steps.cache-zmx.outputs.cache-hit != 'true'
        run: |
          mise run --skip-deps build-zmx

      - name: Copy XCFramework
        run: |
          mise run --skip-deps copy-xcframework

      - name: Setup dev resources
        run: |
          SHELL_SRC="vendor/ghostty/zig-out/share/ghostty/shell-integration"
          SHELL_DST="Sources/AgentStudio/Resources/ghostty/shell-integration"
          if [ ! -d "$SHELL_DST" ]; then
            mkdir -p "$(dirname "$SHELL_DST")"
            cp -R "$SHELL_SRC" "$SHELL_DST"
          fi
          TERMINFO_SRC="vendor/ghostty/zig-out/share/terminfo"
          TERMINFO_DST="Sources/AgentStudio/Resources/terminfo"
          if [ ! -d "$TERMINFO_DST/78" ]; then
            mkdir -p "$TERMINFO_DST/78" "$TERMINFO_DST/67"
            [ -f "$TERMINFO_SRC/78/xterm-ghostty" ] && cp "$TERMINFO_SRC/78/xterm-ghostty" "$TERMINFO_DST/78/"
            [ -f "$TERMINFO_SRC/67/ghostty" ] && cp "$TERMINFO_SRC/67/ghostty" "$TERMINFO_DST/67/"
          fi

      - name: Cache Swift benchmark build
        uses: actions/cache@v4
        with:
          path: .build-ci
          key: benchmark-swift-build-ci-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            benchmark-swift-build-ci-${{ runner.os }}-

      - name: Test large non-WebKit lane
        env:
          SWIFT_TEST_PREBUILD_TIMEOUT_SECONDS: "900"
          SWIFT_TEST_TIMEOUT_SECONDS: "600"
          _XCB_BYPASS: "1"
        run: mise run test:swift:large

      # Runs here, after the Swift toolchain, vendors and dev resources are in place,
      # because the journey needs the Swift development backend the mise task builds.
      - name: BridgeWeb Vite E2E stress journey
        run: mise run test:bridge-web:e2e:stress

      - name: Swift benchmark tests
        run: |
          set -o pipefail
          mise run test:swift:benchmark 2>&1 | tee benchmark.log
          grep -oE "global-preferences-loader (missing|valid) count=[0-9]+ p95_ms=[0-9.]+ max_ms=[0-9.]+ slow_samples_over_10\\.0ms=[0-9]+" benchmark.log > benchmark-lines.txt
          test "$(grep -c "global-preferences-loader missing " benchmark-lines.txt)" -eq 1
          test "$(grep -c "global-preferences-loader valid " benchmark-lines.txt)" -eq 1
          grep -oE "REPO_EXPLORER_NATIVE_TABLE_PILOT_RESULT baseline_p95_ms=[0-9.]+ doubled_p95_ms=[0-9.]+ growth_percent=-?[0-9.]+" benchmark.log >> benchmark-lines.txt
          test "$(grep -c "REPO_EXPLORER_NATIVE_TABLE_PILOT_RESULT " benchmark-lines.txt)" -eq 1
          cat benchmark-lines.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark.log
            benchmark-lines.txt
            test-results-*.xml
          if-no-files-found: warn
