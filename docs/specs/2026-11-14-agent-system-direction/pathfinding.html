## Why this direction exists

> "i lvoe usign agent studio but it does have technical flaws that prevent me form mofin faster.  which wiatne dteo redo design anyways."

> "I think Rust is the better way to go with a lot of the UI, some UI in Swift and some UI in non‑Swift, making multi‑client and distributed."

> "I definitely think that a couple too many things with Agent Studio and the architecture is not good. But I think it's also because it was the first kind of agent‑first project that started."

**Agent diagnosis (engineering hypothesis, not an observed cause):** the Swift process owns rendering, view preparation, *and* execution (git, filesystem watching, terminals, agent detection). The `CLAUDE.md` Performance Lane rules (MainActor admission, Ghostty sample contraction, detached sidebar derivation) suggest that derivation sharing a process with presentation is a recurring cost. Moving execution to Rust Hosts doesn't fix responsiveness by itself: Rust still needs correct source admission, off-main derivation and measured workloads, and the earlier performance bounds stay open. Rex doesn't address this either way.

**Interpretation of "Rust for UI" (agent-recommendation, open):** Rust owns UI *state and view preparation* (Gateway prepared views). Rendering stays native (libghostty/Metal, AppKit/SwiftUI) or web (React/BridgeWeb). A Rust TUI client is possible. Drawing the macOS UI in a Rust toolkit is not proposed.
</script></ex-markdown>

<ex-markdown id="glossary" label="Glossary"><script type="text/markdown">
## Terms as used in this set

| Term | Meaning here | Not to be confused with |
|---|---|---|
| **Router** | codex-router: agent collaboration (boards, threads, inbox, roles, schedules), routing prompts to agent sessions, and the fleet (Central) | A network router |
| **Central** | The Router's cloud control plane (TypeScript Worker on D1): fleet, orgs, enrollment, machine login. Facilitation only (D3) | A relay or data path |
| **Agent Studio** | The runtime (Host: terminals, worktrees, git, review) plus clients (Mac app, web surfaces, phone, CLI) | The macOS app alone |
| **Host** | Rust service on each machine (macOS/Linux) that owns execution on that machine | Gateway |
| **Gateway** | Rust service on each client device that routes to Hosts and prepares views for its clients | Central |
| **Terminal port / adapter** | The Agent Studio–defined terminal interface (D6) and its per-backend implementations (zmx, Rex) | Rex's own protocol |
| **Fleet list** | Central's published list of enrolled machine keys; each connection checks the peer against it | A certificate authority |
| **Hole punching** | Both peers send UDP to each other at a coordinated moment so each NAT admits the other's packets | Port forwarding |
| **Relay** | A server that forwards end-to-end-encrypted packets when no direct path exists | Central |
| **Rex** | Superlogical's closed-source terminal + multiplexer (macOS beta); server owns PTYs, per-client libghostty | zmx (Agent Studio's PTY owner) |
| **E25 / E16** | From the daemon set: one shared logical workspace composition (E25) vs each device's actual windows/panes (E16) | — |
</script></ex-markdown>

<ex-markdown id="hypothesis" label="Current read"><script type="text/markdown">
## Current read (agent), confidence medium

The owner wants a distributed agent workspace: Rust Hosts run work on any machine; per-device Rust Gateways serve thin native/web/phone clients; Router supplies agent collaboration; Central only introduces machines. Rex is a distribution channel and a possible terminal backend, not a foundation. The biggest unknown is O1 (who owns agent execution). It decides whether Router and Agent Studio share a per-machine runtime.

**What would break this read:** the owner says Router is only a messaging layer and never runs agents. Then O1 collapses, the overlap is just "which client shows a session", and the two parts stay fully separate below the UI.
</script></ex-markdown>
