Scope: `docs/specs/2026-10-15-agentstudio-daemon/`, about 577 files (designs 185, explainer 158, research 156, increments 61, assets 15, experiments 2). Most HTML files are generated readers of a Markdown source; deleting a source means deleting its reader too.

<ex-markdown id="criteria" label="Criteria"><script type="text/markdown">
## Deletion criteria (proposed)

A file is a deletion candidate only if **all** hold:

1. Its meaning is superseded by a newer owner decision or by a current doc that carries the same fact.
2. No current doc links to it as a live source (check inbound links).
3. It isn't the only record of an owner quote, experiment result or measured evidence. Evidence moves to `research/evidence/` or is kept, never deleted silently.
4. Its replacement, if any, is named in the row.

Out of scope: rewriting docs that are still correct but verbose. That's `docs-maintain` work, not deletion.
</script></ex-markdown>
