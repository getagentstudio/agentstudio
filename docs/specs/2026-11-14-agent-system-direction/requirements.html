<ex-markdown id="status" label="Status"><script type="text/markdown">
**Status: preliminary draft, 2026-11-14. Not owner-confirmed.** The capability list below is the agent's read and needs the owner to confirm or correct it. Until then every `U` row is `unresolved` or `observational`, except rows that quote owner words, which are `authorized` only for exactly what the quote says. No priorities have been assigned; the owner assigns them.

Relationship to the 2026-10-15 daemon set: that set's [user requirements](../2026-10-15-agentstudio-daemon/user-requirements.md) (U1–U25, S1–S32) remain the detailed source for the Host/Gateway migration. This set covers the **direction** above it: two-part system, connectivity without Tailscale, client topology, Rex. Where an old row is reused, it is cited, not copied.
</script></ex-markdown>

<ex-markdown id="capabilities" label="Capability list"><script type="text/markdown">
## Capability list (agent's read; confirm or correct)

| Key | Name | Purpose: what the owner gets | Part (D2) |
|---|---|---|---|
| `run` | Run anywhere | Agents and their terminals run on any of my machines and survive app restarts and disconnects | Agent Studio |
| `reach` | Reach any machine | Any of my devices connects directly and securely to any of my machines, with no Tailscale, after a one-time enrollment | Agent Studio + Central (facilitation) |
| `see` | See and steer | I watch, type into and steer agents from the Mac, a browser or my phone; each device shows the same work arranged for its size | Agent Studio |
| `review` | Review back to the agent | I review an agent's changes, annotate them, and the annotations go back to that agent | Agent Studio |
| `collaborate` | Agents work as a team | Agents and I coordinate through boards, threads, messages, roles and schedules across machines | Router |
| `interop` | Work with other tools | Rex users can reach my review and agent tools; zmx or Rex can sit underneath as the terminal backend | Agent Studio |

Proposed by the agent; not the owner's words: the names `run`, `reach`, `see`, `review`, `collaborate`, `interop`.
</script></ex-markdown>

<ex-markdown id="boundary" label="Goal boundary"><script type="text/markdown">
## Goal boundary (draft; owner must confirm each item)

| Item | Draft | State |
|---|---|---|
| Primary goal | Move faster: replace the single-process Swift architecture with Rust Hosts + Gateways and thin multi-platform clients, with Router as the collaboration layer | draft from U1/U2/U11 |
| Capabilities | `run`, `reach`, `see`, `review`, `collaborate`, `interop` | **needs confirmation** |
| Reuse | Router (collaboration, Central fleet/enrollment); zmx (PTY owner, libghostty-vt restore); BridgeWeb React surfaces; agentstudio-git semantics (to port into Rust); the daemon set's migration map | draft |
| Missing today | Direct cross-machine reach without Tailscale; phone client; Swift app as a thin client; terminal backend interface; Rex integration | draft |
| May change | agentstudio (Swift app, BridgeWeb), new Rust Host/Gateway crates; codex-router only where O1 says so | draft; O1 open |
| Protected | Router's collaboration semantics; existing Agent Studio feature behavior during migration (strangler, per daemon S29) | prior-owner (S29) + draft |
| Non-goals | Rex-compatible server now; WebTransport as a requirement (D11); a new terminal emulator (use libghostty); drawing the macOS UI in a Rust GUI toolkit; Central carrying terminal bytes (D3); Central carrying live provider control/output (proposed, not owner-confirmed). Whether collaboration or replicated data may pass Central stays open (O9) | draft, except terminal bytes (D3) and WebTransport (D11) |
| Acceptable complexity | **unknown**: e.g. is adopting iroh's Quinn fork acceptable? Is a self-hosted relay acceptable? | open (O3, O8) |
| Outcome evidence | Two-network connection test, Rex action round-trip, phone reconnect after suspend, terminal adapter swap (see [Verification Design](verification.html)) | draft |
| Unresolved | O1–O10 in the [pathfinding record](pathfinding.html#open), including O9 (Central data classes and leases) and O10 (revocation vs offline tolerance) | open |
</script></ex-markdown>
