    <ex-markdown id="program-design" label="Program Design"><script type="application/json" data-ex-markdown-source="">{"text":"# FSEvents overload: Program Design\n\nRealizes [the Specification](2026-11-04-fsevents-overload-specification.md) (R1–R8 over E1–E8), authorized by [the Requirements](2026-11-04-fsevents-overload-requirements.md). Proof strategy: [the Verification Design](2026-11-04-fsevents-overload-verification-design.md).\n\n**Delivery boundary (U11):** this is the **Swift stopgap**. The tiers, the injected platform-neutral source and the directory-level discovery stream are the daemon spec's, which follows the sunclaw measurements. Source anchors are at `main` `e196a7ec6`, under `Sources/AgentStudio/Core/RuntimeEventSystem/Filesystem/` unless stated otherwise.\n\n## What changes: four blocks\n\nEvery file change passes through four blocks. The fix changes what happens **inside** each block, not the order of the blocks. A finished scan feeds back into the Filter, as an updated known-checkout snapshot (Block 4 below).\n\n```mermaid\nflowchart TD\n  ev([\"file changes\"]) --> F[\"1. FILTER\u003cbr/>does this change matter?\"]\n  F --> A[\"2. ADMISSION\u003cbr/>one open obligation per folder\"]\n  A --> D[\"3. DEBOUNCE\u003cbr/>2 s quiet, 10 s max wait\"]\n  D --> S[\"4. SCAN\u003cbr/>walk the folder once\"]\n```\n\n| Block | Today | Target |\n| --- | --- | --- |\n| **1. Filter** | Removes only Git's private staging paths. Every build file still enters the 512-slot queue. | Drops changes strictly inside known checkouts **before** the queue, using the same rule that admission uses. Lost-event signals always pass. |\n| **2. Admission** | The rule is right for accepted batches. On overflow, a weaker rule treats any directory change as relevant. | One rule everywhere. Every relevant change opens or folds into the folder's single obligation. |\n| **3. Debounce** | **None.** Scans are submitted immediately, and follow-ups start back to back. | Per folder: 2 s of quiet, or eligible once the oldest change is 10 s old. A relevant change marks older results stale **immediately**. Explicit demands (add folder, refresh) skip the debounce. |\n| **4. Scan** | Single-flight and at most 2 traversals. | Unchanged. |\n\n### Block 1: Filter\n\n```mermaid\nflowchart LR\n  subgraph today1[\"Today\"]\n    t1[\"FSEvents callback\"] --> t2[\"remove Git staging paths\"] --> t3[\"queue (512)\"]\n  end\n  subgraph target1[\"Target\"]\n    n1[\"FSEvents callback\u003cbr/>0.1 s native batching\"] --> n2[\"filterBatch over the snapshot\u003cbr/>keep: relevant paths, lost-event signals\"]\n    snap[\"snapshot: known checkouts + holds\u003cbr/>pushed by FilesystemActor\"] -.-> n2\n    n2 -->|kept| n3[\"queue (512), now small\"]\n    n2 -->|inside a known checkout| n4[\"dropped, no queue slot\"]\n  end\n```\n\n**Why the debounce sits after the filter, not in it:** the filter has to see every event, because a debounce keeps only the latest and could drop the one event that matters, such as a `.git` marker appearing mid-build. The filter is cheap per event, and FSEvents already batches callbacks at 0.1 s. Waiting pays off only in front of the expensive step, the scan, after the filter has shrunk the input. That's the Selection Rule's order: classify the input, then choose the mechanism.\n\n### Block 2: Admission\n\n```mermaid\nflowchart LR\n  subgraph today2[\"Today\"]\n    a1[\"accepted batch\"] --> a2[\"shouldScan\u003cbr/>correct rule\"] --> a5[\"submit now\"]\n    a3[\"dropped batch\u003cbr/>over 256 paths\"] --> a4[\"mayAffectTopology\u003cbr/>any dir change\"] --> a5\n  end\n  subgraph target2[\"Target\"]\n    b1[\"accepted batch\"] --> b2[\"shouldScan\u003cbr/>same rule\"] --> b4[\"recordTrigger\u003cbr/>open / fold obligation\"]\n    b3[\"dropped batch\u003cbr/>already filtered\"] --> b4\n  end\n```\n\n### Block 3: Debounce\n\n```mermaid\nflowchart TD\n  subgraph today3[\"Today\"]\n    direction TB\n    c1[\"submit\"] --> c2[\"runs at once\"] --> c3[\"finishes\"] --> c4[\"dirty follow-up\u003cbr/>runs at once\"]\n  end\n  subgraph target3[\"Target\"]\n    direction TB\n    d0[\"relevant change\"] --> d5[\"older results stale\u003cbr/>at once\"] --> d1[\"obligation open\"]\n    d1 --> d2{\"2 s quiet?\"}\n    d2 -->|yes| d4[\"submit\"]\n    d2 -->|no| d3{\"oldest change\u003cbr/>10 s old?\"}\n    d3 -->|yes| d4\n    d3 -->|no| d1\n  end\n```\n\n### Block 4: Scan\n\nUnchanged: `WatchedFolderScanScheduler` keeps per-folder single-flight, one merged follow-up and at most 2 concurrent traversals. A finished run feeds back in two ways: it updates the known-checkout snapshot the Filter uses, and it closes the folder's obligation, which restores trusted absence, once it covers every trigger.\n\n\u003cdetails>\n\u003csummary>The full target pipeline in one drawing (all blocks, with code owners)\u003c/summary>\n\n```mermaid\nflowchart TD\n  os[\"FSEvents callback\u003cbr/>one stream per volume, 0.1 s native batching\"]\n  subgraph filter[\"1. FILTER: every event, stateless, no delay\"]\n    classify[\"StreamClient.emitRawEvents\u003cbr/>+ TopologyAdmission.filterBatch\"]\n    snap[\"WatchedFolderAdmissionSnapshot\u003cbr/>known checkouts + holds\"]\n    dropped[\"churn inside known checkouts\u003cbr/>not enqueued\"]\n    snap -.->|read under lifecycleLock| classify\n    classify --> dropped\n  end\n  buf[\"IngressBuffer, 512 batches, unchanged\u003cbr/>now carries only relevant paths + coverage loss\"]\n  subgraph admission[\"2. ADMISSION: one obligation per folder\"]\n    should[\"TopologyAdmission.shouldScan\u003cbr/>same rule, same snapshot\"]\n    rec[\"Overflow recovery\u003cbr/>only relevant paths retained\"]\n    obligation[\"WatchedFolderScanPacing.recordTrigger\u003cbr/>open or fold into the folder's obligation\"]\n    should --> obligation\n    rec --> obligation\n  end\n  subgraph debounce[\"3. DEBOUNCE: per folder\"]\n    decide[\"decision(at:)\u003cbr/>2 s quiet OR oldest change 10 s old\"]\n  end\n  subgraph scan[\"4. SCAN: unchanged\"]\n    sched[\"WatchedFolderScanScheduler\u003cbr/>single-flight, max 2 traversals\"]\n    apply[\"FilesystemActor applies result\"]\n    sched --> apply\n  end\n  explicit[\"initialAdd / manual / fallback\u003cbr/>bypass debounce\"]\n  os --> classify\n  classify -->|\"relevant + coverage loss\"| buf\n  buf -->|accepted| should\n  buf -->|dropped| rec\n  obligation --> decide\n  decide -->|eligible| sched\n  explicit --> sched\n  apply -->|\"covering run closes the obligation\"| decide\n  apply -->|inventory changed| snap\n```\n\n\u003c/details>\n\n### Why this is better\n\n| | Today | Target |\n| --- | --- | --- |\n| A build inside a known checkout (100k+ changes) | fills the intake; on overflow, becomes \"rescan the whole folder\", over and over | filtered at the source; uses no intake slot; **0 scans** |\n| A worktree created or removed | about 59k recovery records in 10 min; back-to-back scans | one obligation; scanned **once** after 2 s of quiet, at most 1 + ⌈duration / 10 s⌉ runs |\n| A continuous 10-minute burst of new checkouts | back-to-back scans for the whole burst | about one scan every 10 s |\n| OS reports dropped events | immediate scan, then a follow-up for every burst after it | one paced scan; never skipped |\n| A worktree restored while an older scan that missed it finishes | the older result can mark it gone | the change marks older results stale at once, so it can't |\n| User adds a folder or refreshes | immediate | immediate, unchanged |\n| Measuring it | recovery records only | each scan logged with reason, wait and folded-trigger count |\n\nThe fix applies the rule the architecture doc already states (\"directory changes inside a known checkout do not request a full scan\"). It applies it where the loss happens, and reuses a debounce the codebase already trusts. The scheduler, where the separate crash (LUNA-514) lives, isn't touched.\n\n## Structure decision\n\n**Selected:** relevance moves to the source, and pacing goes in `FilesystemActor`.\n- **Source relevance:** the stream client filters watched-folder batches with the existing topology rule, against an immutable snapshot that `FilesystemActor` publishes.\n- **Pacing:** a per-folder debounce, modeled on the Git-lane debounce at `FilesystemActor.swift:525-657`.\n- **Explicit demands** stay immediate.\n- **The scheduler** is unchanged.\n\n| Alternative | Why not |\n| --- | --- |\n| Pacing inside `WatchedFolderScanScheduler` (a future `readyAt` plus a deadline task) | The architecture doc assigns debounce to `FilesystemActor` (workspace_data_architecture 420-430). The proven debounce pattern lives there. The scheduler is under an open corruption investigation (LUNA-514), and adding time state to its `SchedulingStateStore` touches exactly that code. |\n| Keep the topology relevance only through overflow, with no source filter | R1 would hold under overload, but irrelevant churn would still take up intake slots and push out relevant batches. That keeps the 274-registration fan-out pressure. |\n| Retain recovery records across drains inside `IngressBuffer` (as first proposed) | Redundant: the pacer's per-folder obligation is the one durable home for recovery intent (E6), and the buffer's record stays transport only. |\n| Stale-absence protection through a new \"unsettled\" store consulted by each reader | The four readers already compare against one newest-demand marker (`ResultApplication:110-119, 135, 218-219, 244-246`). Clearing it at trigger time protects all four with no new state. |\n| Native FSEvents exclusions, a larger buffer, or a longer stream latency | Non-goals. They move pressure around without fixing what the overflow path does. |\n\n**Cost:**\n- One new interface method on `FSEventStreamClient`; its test fakes change.\n- One new pure reducer and one deadline task in `FilesystemActor`.\n- Per-callback prefix checks on the FSEvents dispatch queue.\n- Discovery of a new checkout during churn waits up to 2–10 s, plus the run's duration.\n\n**What would reopen the choice:**\n- Post-change telemetry shows completed runs exceeding the trigger-trace bound (1 + k + ⌈D/10⌉) on the V9 workload.\n- The source filter measurably costs callback time: over 1 ms median per callback in the ingress snapshot.\n- A missed discovery appears that's traceable to a stale snapshot.\n\n## Entities and where they live\n\n| E | Semantic owner | Home (`new`/`modified`/`existing`) | Type home | Shape at boundaries | Kind | Convention |\n| --- | --- | --- | --- | --- | --- | --- |\n| E1 Watched folder | `FilesystemActor` | existing: `watchedFolderScanState.registrationsBySourceID` | `FilesystemSourceID`, `FilesystemWatchedFolderRegistration` | `FilesystemSourceID` to the scheduler; legacy routing `UUID` to the stream client | persisted (watch list) | existing |\n| E2 Known checkout | `FilesystemActor` (inventory) | existing: `inventoryBySourceID[...].repoGroups` and `publicationHoldPathsByID`. **New:** projection `WatchedFolderAdmissionSnapshot` | `RepoScanner.RepoScanGroup`; new `WatchedFolderAdmissionSnapshot` in `WatchedFolderTopologyAdmission.swift` | `WatchedFolderAdmissionSnapshot { canonicalRoot: String; lexicalRoot: String; casePolicy: FilesystemVolumeCasePolicy; knownCheckoutPaths: Set\u003cString> /* comparison form, holds included */; maxScanDepth: Int }`, a `Sendable` value from actor to client | derived | Swift value types, `Sendable` |\n| E3 File change | OS, via `DarwinFSEventStreamClient` | existing | `FSEventBatch`, `FSEventObservation` | unchanged | transient | existing |\n| E4 Membership-relevant change | `WatchedFolderTopologyAdmission` (sole rule owner) | modified: the existing `shouldScan` rules re-expressed per path over the snapshot, plus the scanner bounds for (c) | `filterBatch(_:snapshot:) -> FSEventBatch?`; `shouldScan(_:snapshot:)`; the routine and discovery-sensitive Git sets stay where they are (`:7-14`, `:69-87`) | an `FSEventBatch` holding only relevant paths and observations, or `nil` | derived | pure static functions, as today |\n| E5 Coverage loss | `DarwinFSEventStreamClient` / `DarwinFSEventIngressBuffer` | existing | `FSEventObservation.hasCoverageLoss`, `FSEventOverflowRecovery` | unchanged | transient | existing |\n| E6 Recovery obligation | `FilesystemActor` | **new**: `WatchedFolderScanPacing` in `FilesystemActor+WatchedFolderScanPacing.swift`, held in `watchedFolderScanState.pacing` | `struct WatchedFolderScanPacing`; `enum PacedScanObligation { case open(OpenInterval), submitted(InFlightSubmission, pendingInterval: OpenInterval?) }`; `struct OpenInterval { firstTriggerAt: Duration; lastTriggerAt: Duration; triggerRevision: UInt64; foldedTriggerCount: Int; quietGapCount: Int; intervalOrdinal: UInt64; reasons: WatchedFolderScanTriggerReasons }`, plus per obligation `obligationOrdinal`, `openedAt` and the completed change-driven run count; `struct InFlightSubmission { submissionSequence: UInt64; coveredRevision: UInt64; cause: WatchedFolderScanCause; reservedAt: Duration }`, registered **synchronously before** `await submit`, for every cause; `triggerRevisionBySourceID: [FilesystemSourceID: UInt64]`, which increases on every relevant trigger | none: it never crosses an actor boundary | in-memory | mirrors `PendingWorktreeChanges` |\n| E7 Scan run | `WatchedFolderScanScheduler` | existing, unchanged | `ScheduledWatchedFolderScanResult` (carries `demandCoverage` and the run's `scanRunGeneration`) | unchanged | in-memory | existing |\n| E8 Explicit scan demand | `FilesystemActor` | existing | `WatchedFolderScanCause.initialAdd`, `.manual`, `.fallback`; retention selective scans | unchanged | — | existing |\n| (R7 marker) newest-demand marker | `FilesystemActor` | **modified meaning**: `watchedFolderScanState.latestDemandCoverageBySourceID` | `[FilesystemSourceID: WatchedFolderScanDemandCoverage]`; an absent key now also means \"a trigger is unsubmitted\" | read by `ResultApplication:110-119, 135, 218-219, 244-246` | in-memory | existing |\n\nPolicy constants (`AppPolicies.WatchedFolderScanning`, modified): `changeDebounce = .seconds(2)` and `changeMaximumWait = .seconds(10)`. They're behavior, so they're policies and not styles.\n\n## Components\n\n```mermaid\nflowchart TD\n  subgraph intake[\"Intake: FSEvents queue\"]\n    direction TB\n    client[\"StreamClient\u003cbr/>modified\"]\n    buffer[\"IngressBuffer\u003cbr/>unchanged\"]\n  end\n  subgraph actor[\"FilesystemActor\"]\n    direction TB\n    ws[\"+WatchedFolderScanning\u003cbr/>modified\"]\n    pacing[\"+WatchedFolderScanPacing\u003cbr/>new\"]\n    apply[\"+ResultApplication\u003cbr/>modified\"]\n  end\n  rule[\"TopologyAdmission\u003cbr/>modified: one rule\"]\n  sched[\"ScanScheduler\u003cbr/>unchanged\"]\n  client --> buffer --> ws\n  client -. uses .-> rule\n  ws -. uses .-> rule\n  ws --> pacing --> sched\n  sched --> apply --> pacing\n  apply -. snapshot .-> client\n```\n\n| Component | Job | Owns | Consumers | Reason to change |\n| --- | --- | --- | --- | --- |\n| `WatchedFolderTopologyAdmission` | decides membership relevance | the only relevance rule (E4) | stream client, `FilesystemActor` | the discovery contract changes |\n| `DarwinFSEventStreamClient` | turns callbacks into batches | the latest admission snapshot per watched-folder registration | ingress buffer | the intake shape changes |\n| `WatchedFolderScanPacing` | decides when a change-driven demand may be submitted, and when an obligation is served | E6 | `FilesystemActor+WatchedFolderScanning`, `+ResultApplication` | the debounce policy changes |\n| `FilesystemActor+WatchedFolderScanning` | receives triggers, invalidates stale authority, submits demands | trigger routing; the newest-demand marker; snapshot publication | ingress loop | scan admission changes |\n| `FilesystemActor+WatchedFolderResultApplication` | applies completed runs | inventory and negative authority (existing); now also closing obligations and run telemetry | scheduler result drain | result semantics change |\n| `WatchedFolderScanScheduler` | runs scans, with single-flight and the 2-traversal limit | E7 | `FilesystemActor` | unchanged here |\n\n**Forbidden edges:**\n- The stream client never calls the actor. It only reads the immutable snapshot the actor pushed.\n- The pacer never touches the scheduler's state.\n- No path or file name goes into telemetry.\n\n## Interfaces\n\n**`FSEventStreamClient.updateWatchedFolderAdmission(worktreeId: UUID, snapshot: WatchedFolderAdmissionSnapshot?)`** (new requirement on the protocol)\n- Replaces the snapshot for one watched-folder registration atomically, under the client's `lifecycleLock`.\n- `nil` clears it, so that registration's batches are unfiltered, as today.\n- Applies to callbacks that start after it returns.\n\n**`WatchedFolderTopologyAdmission.filterBatch(_ batch: FSEventBatch, snapshot: WatchedFolderAdmissionSnapshot) -> FSEventBatch?`** (new; pure)\n- Keeps every coverage-loss observation, and every path or observation that matches E4(a)–(d) under the existing rule. (c) is additionally bounded to `depth(path relative to canonicalRoot) ≤ maxScanDepth`, with no hidden path component other than a final `.git`.\n- Returns `nil` when nothing remains.\n- `shouldScan(_:snapshot:)` becomes `filterBatch(...) != nil`, so accepted and dropped batches use one rule.\n- `mayAffectTopology` remains only for retained recoveries, which hold already-filtered paths.\n\n**`WatchedFolderScanPacing`** (new; a pure reducer, fed explicit `now` values):\n\n```swift\nmutating func recordTrigger(_ id: FilesystemSourceID, reason: WatchedFolderScanTriggerReason, at now: Duration) -> UInt64  // new revision\nfunc decision(at now: Duration) -> WatchedFolderPacingDecision\nmutating func recordAccepted(_ id: FilesystemSourceID, coveredRevision: UInt64, coverage: WatchedFolderScanDemandCoverage, at now: Duration)\nmutating func recordRunCompleted(_ id: FilesystemSourceID, coverage: WatchedFolderScanDemandCoverage) -> WatchedFolderPacingClosure\nmutating func removeFolder(_ id: FilesystemSourceID)\nenum WatchedFolderPacingDecision: Equatable { case submit([(FilesystemSourceID, coveredRevision: UInt64)]), wait(until: Duration), idle }\nenum WatchedFolderPacingClosure: Equatable { case closed, stillOpen, notCovered }\nenum WatchedFolderScanTriggerReason: Equatable { case relevantChange, nativeCoverageLoss, intakeCoverageLoss }\n```\n\n**Eligibility:** an `open` interval is eligible when `now ≥ lastTriggerAt + changeDebounce`, or when `now ≥ firstTriggerAt + changeMaximumWait`. A folder whose obligation is `submitted` with no pending interval isn't eligible. A pending interval on a `submitted` folder becomes eligible by the same rule, and its submission merges in the scheduler as a dirty follow-up. Its covering run is that dirty run.\n\n**One submission protocol, for every cause.** It reuses the existing `submissionSequence`, which is reserved synchronously in `watchedFolderScanRequest` (`FilesystemActor+WatchedFolderScanning.swift:340-360`). A result covers every submission for its folder **up to `result.request.submissionSequence`**, because merged demands keep the newest request (`WatchedFolderScanSchedulerState.swift:9-18`). The publication-hold code already uses the same ordering (`FilesystemActor+PublicationHold.swift:54-66`).\n\n| Event | Rule (callback, initialAdd, manual, fallback and retention alike) |\n| --- | --- |\n| reserve (before `await`) | record `InFlightSubmission(seq, coveredRevision = current triggerRevision)` |\n| acceptance returns | set `latestDemandCoverageBySourceID = coverage` **only if** `triggerRevision == coveredRevision`, the registration is unchanged, and the marker isn't already at or past this coverage. Otherwise, leave it. |\n| a result arrives (in either order relative to acceptance) | Let `s` be the newest in-flight submission with `seq ≤ result.request.submissionSequence`. The result **is current** only if all three hold: (1) `triggerRevision == s.coveredRevision`; (2) the registration is unchanged; (3) **no newer demand exists**, meaning no in-flight or accepted submission with `seq > result.request.submissionSequence`, and the marker isn't past `result.demandCoverage` by `throughDemandGeneration`. **The marker never moves backwards.** If current, set the marker to `result.demandCoverage` before the inventory reduction, settle every in-flight submission up to `s`, and close the obligation. Otherwise, apply positive-only. Settle only the submissions this result covers, and leave a newer submission's work open: an old result never closes, or restores authority over, a newer demand. |\n| a trigger | `triggerRevision += 1`, clear the marker, open or fold the interval |\n\nWhichever comes first, the acceptance or the result, the final state is the same: the covering result is authoritative exactly once, and the obligation is closed exactly once. A later acceptance for an already-settled submission is a no-op.\n\n## The main path, step by step\n\n**Trigger, invalidation and obligation**\n1. An FSEvents callback runs `DarwinFSEventStreamClient.emitRawEvents` (`:619-650`).\n2. For a registration with a snapshot, `filterBatch` runs first. A `nil` result means **no yield**.\n3. A surviving batch reaches `ingressBuffer.yield`, unchanged.\n4. The `FilesystemActor` ingress loop calls `handleWatchedFolderFSEvent` (`FilesystemActor+WatchedFolderScanning.swift:161`). When `shouldScan(batch, snapshot)` is true, it does two things:\n   - **(a) R7, at once:** it removes `latestDemandCoverageBySourceID[sourceID]`. From this instant, `mayReplaceNegativeSpace` (`ResultApplication:117-119`), authoritative coverage (`:135`), currentness (`:218-219`) and overlapping completeness (`:244-246`) are false for every earlier result. Earlier results can still add positive discoveries.\n   - **(b)** It calls `pacing.recordTrigger(...)` and reschedules the pacing deadline. **It doesn't submit.**\n5. A watched-folder overflow recovery (`FilesystemActor.swift:456-483`) takes the same route. Retained paths go through step 4. A coarse recovery runs 4(a), then `recordTrigger(.intakeCoverageLoss)`, in place of `handleCoarseWatchedFolderFSEvent`'s direct submit.\n\n**Deadline to submission**\n\n6. One pacing task sleeps on `schedulingClock` until `decision`'s `wait(until:)`. This is the `drainPendingChanges` pattern (`FilesystemActor.swift:525-570`).\n7. On `.submit`, each folder goes through the submission protocol above with `cause: .callback`: reserve, then `await submit`, then the acceptance rule. Record a `watched_scan_demand` record.\n\n**Run to closure**\n\n8. The scheduler runs it, unchanged, possibly merging several demands into one run or a dirty follow-up.\n9. `applyWatchedFolderScanResult` (`ResultApplication:98`) first runs the protocol's **result rule**: decide currency, then set the marker if current. Then it reduces the inventory exactly as today (negative authority only when the marker equals `result.demandCoverage`), closes the obligation through `pacing.recordRunCompleted`, and records `watched_scan_run` with `scanRunGeneration`.\n10. When the inventory changed (`:139-152`), it rebuilds the snapshot and calls `updateWatchedFolderAdmission`.\n\n**Explicit demands:** `initialAdd`, `manual`, `fallback` and retention scans submit at t+0, as today, but through the **same** submission protocol. Their acceptance no longer restores the marker unconditionally (today's `:101-104` and `:324-327`). The revision rule above applies, so an old explicit acceptance can't undo a newer trigger's invalidation (R6, R7). Their completed run closes any obligation it covers.\n\n**Holds and registration:**\n- A change to `publicationHoldPathsByID` republishes the snapshot.\n- Registering a folder publishes its snapshot.\n- Unregistering clears the snapshot and calls `removeFolder`.\n\n## The obligation's lifecycle\n\n```mermaid\nstateDiagram-v2\n  direction LR\n  [*] --> None\n  None --> Open: trigger\n  Open --> Open: trigger (fold)\n  Open --> Submitted: submitted\n  Open --> None: covering result first\n  Submitted --> Pending: trigger\n  Pending --> Pending: trigger (fold)\n  Pending --> Submitted: pending submitted\n  Submitted --> None: covering run done\n  Pending --> Open: covering run done\n```\n\n**Reading it:**\n- \"Pending\" is short for `SubmittedWithPending`: a submitted scan is running, and newer triggers are waiting behind it.\n- Every trigger clears the newest-demand marker.\n- \"Submitted\" means an explicit or a paced demand was accepted, under the submission protocol.\n- \"Covering\" means the result covers the newest in-flight submission, and no trigger came after it.\n- From **any** state, `removeFolder` (the folder is unwatched) goes straight to None.\n\n**Illegal states:**\n- Two obligations per folder can't exist: the state is keyed by `FilesystemSourceID`.\n- A submission can't close a later trigger: closure compares revisions.\n- A result can't certify absence while a trigger is unsubmitted: only the result rule or the acceptance rule sets the marker, and both check `triggerRevision`.\n- No arrival order makes a covering result count twice or not at all, because settlement is keyed by `submissionSequence`.\n- An older result can't regain negative authority after a newer demand: both rules keep the marker monotonic, and the result rule also requires that no newer submission exists (workspace_data_architecture 350-356).\n\n## Failure, recovery and concurrency\n\n| Situation | Behavior | Owner |\n| --- | --- | --- |\n| A stale snapshot: a new checkout isn't in it yet | Its interior changes count as relevant, so an extra paced run happens (errs safe) | `TopologyAdmission` |\n| A stale snapshot: a removed checkout is still in it | The root's own removal or rename isn't \"strictly inside\", so it stays relevant | `TopologyAdmission` |\n| A trigger arrives during `await submit` (any cause) | The acceptance rule sees `triggerRevision ≠ coveredRevision`, so the marker stays cleared and the interval stays pending | `FilesystemActor` |\n| The result arrives before the acceptance | The result rule settles it from the in-flight record, so authority and closure happen once. The late acceptance is a no-op. | `FilesystemActor` |\n| A run is stale-dropped or superseded | Its demand survives as dirty (`WatchedFolderScanScheduler.swift:845-857`, `preserveDirtyAfterStaleCompletion :891-900`), so a later completed run covers it; the obligation stays `submitted` until then | scheduler (existing) |\n| A registration is retired, or the scheduler shuts down or rejects | `removeFolder` or `.rejected`: the obligation is dropped with its registration; on rejection it stays open, and the next decision retries | `FilesystemActor` |\n| A long single-flight run | The pending interval waits for it; R4 grants eligibility, not a start | scheduler (existing) |\n| The pacing sleep fails | It's logged and rescheduled, as in `drainPendingChanges` | `FilesystemActor` |\n| OS coverage loss with only in-checkout paths | `filterBatch` always keeps it (R5) | `TopologyAdmission` |\n\n**Concurrency:**\n- Pacing and the marker are actor-isolated in `FilesystemActor`.\n- The snapshot is an immutable `Sendable` value, handed over under the client's existing `lifecycleLock`.\n- No new main-actor work.\n\n## Cross-cutting\n\n- **Performance:** the source filter costs O(paths × path depth) Set lookups on the FSEvents queue, in place of enqueueing those paths. It's measured in ingress callback timing and V9.\n- **Telemetry (R8):** two new `performanceTraceRecorder` events.\n  - `performance.filesystem.watched_scan_demand`: folder tag, `obligationOrdinal` (per folder, increments when an obligation opens), `intervalOrdinal`, reason, `firstTriggerOffsetMs` and `lastTriggerOffsetMs` (monotonic milliseconds since the obligation opened), `quietGapCount` (gaps of 2 s or more between recorded triggers in this interval), folded-trigger count, `obligationWaitMs` (submission time minus the obligation's open time), `submissionSequence`.\n  - `performance.filesystem.watched_scan_run`: folder tag, `scanRunGeneration`, the `submissionSequence` and demand generation it covers, duration, and `obligationOrdinal` when it closed one.\n  - `performance.filesystem.watched_scan_obligation`: folder tag, `obligationOrdinal`, phase `closed`, `spanMs` (first to last recorded trigger), total `quietGapCount`, the run generation that closed it, and the count of completed change-driven runs attributed to it. This is the record V9 computes 1 + k + ⌈D/10⌉ from, and compares against.\n  - Runs are counted from completed results. A cancelled run without a result is not counted (a stated limit).\n  - Folder tags use the existing process-seeded `diagnosticTag`; no paths.\n- **Security, accessibility:** not applicable.\n\n## Trace table\n\n| U | R | E | Owner | Interface | Shape and home | State | Failure | Proof |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| U1 U2 | R1 | E1–E4, E7 | `WatchedFolderTopologyAdmission` + stream client | `filterBatch`, `updateWatchedFolderAdmission` | `WatchedFolderAdmissionSnapshot` (TopologyAdmission.swift) | snapshot per registration (client) | a stale snapshot over-scans | seam: `filterBatch` pure; client with injected stream factory and a capacity-1 buffer; actor fixture |\n| U3 U7 | R2 | E1, E4–E7 | `WatchedFolderScanPacing` + the submission protocol in `FilesystemActor` | `recordTrigger / recordRunCompleted`; reserve, acceptance and result rules | `PacedScanObligation`, `InFlightSubmission` (+WatchedFolderScanPacing.swift) | None / Open / Submitted / SubmittedWithPending | in-flight trigger; result before acceptance; stale drop; rejection | seam: reducer; actor fixture with the existing acceptance gate (`FilesystemActorWatchedFolderTestSupport.swift:99-129`) and a held result, in both orders |\n| U3 U4 | R3 | E1, E6 | `WatchedFolderScanPacing` | `decision(at:)` debounce branch | `WatchedFolderPacingDecision` | `lastTriggerAt` | sleep failure retried | seam: reducer + actor on `TestPushClock` |\n| U4 U7 | R4 | E1, E6, E7 | `WatchedFolderScanPacing` | `decision(at:)` maximum-wait branch | same | `firstTriggerAt` | long run: eligibility only | seam: reducer + actor on `TestPushClock` |\n| U7 | R5 | E1, E5, E6 | `TopologyAdmission` + pacing | `filterBatch` keeps coverage loss; `recordTrigger(.native/.intakeCoverageLoss)` | `WatchedFolderScanTriggerReason` | Open | — | seam: `filterBatch` + actor overflow path with fake client |\n| U7 | R6 | E6–E8 | `FilesystemActor+WatchedFolderScanning` | the same submission protocol at t+0 | `WatchedFolderScanCause` (existing) | Submitted | an old explicit acceptance after a newer trigger | seam: actor fixture with the acceptance gate, for manual (tracked) and fallback (untracked) |\n| U7 | R7 | E1, E2, E4–E7 | `FilesystemActor` (marker) + existing result application | marker cleared in step 4(a); set only by the acceptance and result rules | `latestDemandCoverageBySourceID` (existing) | marker present / absent | an explicit or callback acceptance after a newer trigger; a result first | seam: actor + **real scanner** in temp repos, with the acceptance gate and a held result; own and overlapping receipt queries |\n| U5 | R8 | E1, E5–E7 | `FilesystemActor` (the pacer supplies the trigger-trace fields) | `performanceTraceRecorder.record(.watchedScanDemand / .watchedScanRun / .watchedScanObligation, …)` | attribute set in `AgentStudioOTLPRepoExplorerTaxonomy` | — | recorder fail-open | seam: recorder fake in actor tests; marker-scoped Victoria in the V9 workload |\n\nThe daemon spec (tiers U8, injected platform-neutral source U9, directory-level discovery stream) follows the sunclaw measurements, as a separate document in this set.\n","reference":"./2026-11-04-fsevents-overload-program-design.md"}</script></ex-markdown>

  <section label="Requirements">
    <ex-markdown id="requirements" label="Requirements"><script type="application/json" data-ex-markdown-source="">{"text":"# FSEvents overload: Requirements\n\nLinear: [LUNA-581](https://linear.app/askluna/issue/LUNA-581/fsevents-overload-amplifies-watched-folder-rescans). Specification: [2026-11-04-fsevents-overload-specification.md](2026-11-04-fsevents-overload-specification.md).\n\n## Who is affected and what hurts today\n\n**The owner, as the daily user of Agent Studio.** Agents create and remove worktrees, run builds and copy `tmp/` folders inside watched folders around the clock, often while nobody is at the machine. Each of these operations changes 100k+ files at once. The production app (v0.0.124) answers those bursts by rescanning whole watched folders over and over, with nobody using it:\n\n- **Observed:** one worktree removal (about 150k deletes plus 150k copies) produced 59,151 coarse overflow recoveries in 10 minutes. In one hour, 67,827 intake batches were dropped and 66,364 accepted. Source: production VictoriaLogs, `service.version` 0.0.124, 2026-11-04 13:45–14:45 UTC.\n- **Observed:** the Nov 3 crash's fault log shows the scheduler cycling through a scan's candidates continuously, at about 818k transitions in 29 h, while the owner was away.\n- **Cost:** constant background CPU and disk work, and much more exposure for the separate scheduler crash ([LUNA-514](https://linear.app/askluna/issue/LUNA-514)), which happens during this churn.\n\n**Downstream consumers of discovery.** The sidebar's repository and worktree list, and repository retention, rely on watched-folder scans to learn that a checkout appeared, moved or disappeared. They must keep getting correct results.\n\n## What the owner asked for\n\n| ID | Need, in the owner's words | Where it was said | Authority | Priority |\n| --- | --- | --- | --- | --- |\n| U1 | \"make sure we don't do excess work walking the tree\" | chat, 2026-11-04 | authorized | must, owner |\n| U2 | \"make sure that we don't look at files that don't matter. So these are all filters\" | chat, 2026-11-04 | authorized | must, owner |\n| U3 | \"you have to have admission, then a debounce afterwards on how and what the downstream events may happen based on the input\" | chat, 2026-11-04 | authorized | must, owner |\n| U4 | Discovery re-scan pacing: \"2s debounce with max wait of 10s is good\". This supersedes the earlier \"min 2s. max 30.\" from page comment `02b7d273`. | chat, 2026-11-04 | authorized | must, owner |\n| U8 | Tiered coalescing: \"we need to coalesce foreground repos at X vs background per Y\", then \"2s, 30s is fine\": foreground repos at 2 s, background repos at 30 s | chat, 2026-11-04 | authorized | must, owner |\n| U9 | \"fsevent should be an interface where implementation is injected… our interface is generic so later this works for linux or whatever\" | chat, 2026-11-04 | authorized | must, owner |\n| U10 | \"we need actual design change\", and \"i think you need to test things out and find out\": the design is grounded in measured event volumes, not guesses | chat, 2026-11-04 | authorized | must, owner |\n| U11 | Delivery split: the Rust daemon that will own file watching is \"hope in a month\", so no Swift crash diagnostics. A small Swift stopgap ships now; the full design (tiers, injected platform-neutral source, directory-level discovery) is the daemon's spec | chat, 2026-11-05 | authorized (Lead recommendation adopted on the owner's timeline) | must, owner |\n| U5 | \"why the fuck do you not check the logs with code and add logging and tracing?\" The fix must be observable in telemetry. | chat, 2026-11-04 | authorized | must, owner |\n| U6 | \"i want full change and design to properly fix this\": a complete fix of the FSEvents-to-scanner pipeline, not a minimal patch | chat, 2026-11-04 | authorized | must, owner |\n| U7 | Discovery stays correct: a new, moved or removed checkout still reaches the sidebar and retention, and lost events never silently drop a directory move | existing contract, [workspace_data_architecture.md:342-348](../../architecture/state/workspace_data_architecture.md) | authorized (existing normative contract) | must, contract |\n\n## Goal boundary\n\n```mermaid\nflowchart LR\n  bursts[\"Bulk file activity\u003cbr/>agent worktrees, builds, tmp copies\"] --> app([\"Agent Studio\u003cbr/>file-change intake and folder discovery\"])\n  app --> quiet[\"Wanted: background stays quiet\u003cbr/>U1 U2 U3 U4\"]\n  app --> correct[\"Wanted: discovery stays correct\u003cbr/>U7\"]\n  app --> seen[\"Wanted: the reduction is measurable\u003cbr/>U5\"]\n```\n\n- **Goal:** a burst of file activity inside watched folders costs at most a small, bounded number of watched-folder scans. Changes that can't affect discovery cost none. Discovery results stay correct.\n- **Existing foundation to keep:** one physical FSEvents stream per volume, the scheduler's per-folder single-flight with one merged follow-up, at most 2 concurrent traversals, stale-result validation, and the bounded scanner (depth 4, stops at `.git` markers).\n- **What's missing:** irrelevant changes are filtered only after the bounded intake. Overflow recovery skips the known-checkout rule. Recovery intent is cleared on every drain. Follow-up scans have no pacing.\n- **Why we watch at all:** to keep the **sidebar** current. That means the repository and worktree list (discovery, from watched folders), each worktree's Git chips and recency (from every known worktree), and panes in those worktrees. Today all of that is watched at file level, for every known worktree, around the clock, whether or not anyone is looking.\n- **May change, in the Swift stopgap (U11):** the filesystem intake and watched-folder scanning code under `Sources/AgentStudio/Core/RuntimeEventSystem/Filesystem/`, with related policy constants and telemetry.\n- **Daemon spec (U11), design only here:** the platform-neutral file-change source with FSEvents injected (U9); foreground and background tiers for worktree watching and coalescing (U8); a directory-level discovery stream. These are implemented in the Rust daemon, not in Swift.\n- **Protected:**\n  - the discovery, retention and negative-space contracts;\n  - **correctness** of Git chips, recency and pane facts (their **cadence** becomes tiered);\n  - the scanner's traversal bounds;\n  - production identity and data.\n- **Acceptable complexity:** changes in the existing owners. A new mechanism is acceptable when Program Design names the rule it satisfies. No new app-wide atoms, bus events or coordinators.\n- **Acceptable evidence:** RED-first tests at the existing owners, plus before/after production-class telemetry for the same worktree create/remove workload.\n\n### Owner deliverable expectations\n\nThe owner asked to see \"what we want to do and why this will be better\" and \"diagram needed\". The Program Design shows the target pipeline next to today's, with diagrams, and the owner review page renders it. This shapes how the design is presented. It isn't product behavior.\n\n## Non-goals\n\n- **Root-causing or fixing the scheduler table corruption (LUNA-514).** That stays a separate investigation. This work only removes the churn it rides on.\n- **Incremental or journal-replay scanning** that avoids whole-folder scans for path-scoped changes. That's a separate design.\n- **Globally ignoring `.git`, `node_modules`, `tmp` or build directory names**, which would hide newly created repositories in a watched folder.\n- **Gating watched-folder scans on what's visible.** A watched folder is a standing subscription.\n- **Raising the queue size or the FSEvents latency** as the fix.\n","reference":"./2026-11-04-fsevents-overload-requirements.md"}</script></ex-markdown>
  </section>
  <section label="Specification">
    <ex-markdown id="specification" label="Specification"><script type="application/json" data-ex-markdown-source="">{"text":"# FSEvents overload: Specification (Swift stopgap)\n\nAuthorized by [the Requirements](2026-11-04-fsevents-overload-requirements.md). Realized by [the Program Design](2026-11-04-fsevents-overload-program-design.md); proven per [the Verification Design](2026-11-04-fsevents-overload-verification-design.md).\n\n**Delivery boundary (U11).** This Specification is the **Swift stopgap** that ships now: filter, discovery debounce, stale-evidence invalidation and scan-run telemetry for watched-folder discovery. The foreground/background tiers (U8), the injected platform-neutral source (U9) and directory-level discovery streams belong to the **daemon spec**, which follows the sunclaw measurements (U10). Nothing here constrains how the daemon realizes them.\n\n## The problem in observable terms\n\n| ID | Today | Who pays | Where it's observed |\n| --- | --- | --- | --- |\n| P1 | A burst of file changes inside known checkouts (builds, worktree copies) leads to repeated **whole watched-folder scans**, although such changes can't alter which checkouts exist | the owner: CPU, disk, crash exposure | production telemetry: 59,151 `overflow_coarse` recoveries in 10 min during one worktree removal |\n| P2 | While a burst lasts, a folder is scanned back to back | the owner: sustained background work | fault-log ring: continuous scan cycling for 29 h |\n| P3 | Telemetry counts recovery records, not actual scan runs, so the waste can't be measured | the owner, when diagnosing | the `stage_outcome` records carry no run identity |\n\nDiscovery is correct today. The obligations below keep it that way.\n\n## Outcomes\n\n- **O1:** Changes that can't affect which checkouts exist start no scan, even when the intake is overloaded. (P1; U1, U2)\n- **O2:** A burst becomes a small, bounded number of scans per folder, paced by a 2 s debounce with a 10 s maximum wait. (P1, P2; U3, U4)\n- **O3:** Membership-relevant changes and lost events are always reconciled, and while they're unreconciled, no older result is trusted as proof of absence. (U7)\n- **O4:** Telemetry shows how many scans actually ran, for which folder and why. (P3; U5)\n\n## Entities\n\n```mermaid\nerDiagram\n  WATCHED_FOLDER ||--o{ KNOWN_CHECKOUT : \"contains\"\n  FILE_CHANGE }o--|| WATCHED_FOLDER : \"observed under\"\n  FILE_CHANGE }o--o| KNOWN_CHECKOUT : \"falls inside\"\n```\n\n```mermaid\nerDiagram\n  WATCHED_FOLDER ||--o| RECOVERY_OBLIGATION : \"has at most one\"\n  COVERAGE_LOSS }o--|{ WATCHED_FOLDER : \"affects\"\n  RECOVERY_OBLIGATION ||--o| SCAN_RUN : \"closed by one\"\n  WATCHED_FOLDER ||--o{ SCAN_RUN : \"reconciled by\"\n```\n\n| ID | Term | Identity rule | Relationships | Invariants | Observable states | Replaces | Basis |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| E1 | **Watched folder** | One persisted watch on one canonical folder path. Removing the watch and adding it back creates a new watched folder. | contains 0..n known checkouts; has at most one open recovery obligation; reconciled by 0..n scan runs | A watched folder is reconciled only while it is persistently watched | watched → unwatched | \"watched root\", \"watched source\" | U7 |\n| E2 | **Known checkout** | One repository checkout (clone or linked worktree) at one canonical root path, as last discovered in a watched folder, including a destination still being created (a held path) | belongs to 1 watched folder for this purpose | A path strictly inside a known checkout's root is \"inside the checkout\" | discovered → missing-pending-proof → absent (retention owns absence) | \"known root\" | U7 |\n| E3 | **File change** | One path-level change notification as the OS reports it; the same path changing twice is two file changes | observed under 1..n watched folders; falls inside 0..1 known checkout | Carries only what the OS reported | — | \"event\" | U2 |\n| E4 | **Membership-relevant change** | A file change that **can** alter which checkouts exist: **(a)** a Git marker appears or disappears; **(b)** a known checkout, or an ancestor of one, moves or disappears; **(c)** a directory appears outside every known checkout **at a depth and place the scanner would visit** (within its traversal depth, not under a hidden directory other than a Git marker); **(d)** a **discovery-sensitive Git input** changes inside a known checkout: its `HEAD`, `config`, `commondir`, `gitdir`, any unrecognized entry under `.git`, or the removal or rename of its `objects` or `refs` directory. **Not relevant:** ordinary files and directories inside a known checkout, and **routine Git content** (`index`, `ORIG_HEAD`, `FETCH_HEAD`, `MERGE_HEAD`, `CHERRY_PICK_HEAD`, `REVERT_HEAD`, `REBASE_HEAD`, `AUTO_MERGE`, `BISECT_LOG`, `COMMIT_EDITMSG`, `packed-refs`, `*.lock`, and descendants of `objects/`, `refs/`, `logs/`, `modules/`, `rebase-merge/`, `rebase-apply/`, `sequencer/`). | a kind of file change | This is the existing watched-folder admission rule (workspace_data_architecture 342-348; `WatchedFolderTopologyAdmission`), extended only by (c)'s scanner bounds | — | \"topology change\" | U2, U7 |\n| E5 | **Coverage loss** | One occurrence of lost or uncertain change history for a scope: the OS reporting dropped or must-rescan events, or intake discarding change detail | affects 1..n watched folders | Never filtered as irrelevant: what was lost is unknown | — | \"overflow\", \"drop\" | U7; Apple FSEvents guide |\n| E6 | **Recovery obligation** | The one outstanding duty, per watched folder, to reconcile it after membership-relevant changes or coverage loss that no **completed covering scan run** has yet served | belongs to 1 watched folder; closed by exactly 1 covering scan run | At most one per folder; later triggers fold into it; it closes only when a scan run whose demand was submitted **after** its latest trigger **completes**. Submission alone never closes it. | open → submitted → closed | \"rescan intent\", \"dirty follow-up\" | U3, U7 |\n| E7 | **Scan run** | One actual traversal of one watched folder, identified by the scheduler's run generation | reconciles 1 watched folder; may close 1 recovery obligation | At most one running per watched folder; several submitted demands may be served by one run | queued → running → completed / cancelled / superseded | \"scan\" | U1 |\n| E8 | **Explicit scan demand** | A scan requested by the user or app lifecycle, not by file changes: adding a watched folder, a manual refresh, startup, the existing fallback rescan, or a retention check | targets 1 watched folder | Never delayed by the debounce | — | \"manual/initial demand\" | U7 |\n\n## Requirements\n\n**R1. Irrelevant changes start no scan, even under overload.** When file changes under a watched folder are not membership-relevant (E4), the system must not start a scan run (E7) of that folder because of them. This must hold the same way whether their batch was accepted or discarded by an overloaded intake. *E1–E4, E7. Basis: U1, U2, contract 342-348.*\n\n**R2. One recovery obligation, closed only by a completed covering run.** When membership-relevant changes or coverage loss occur for a watched folder, the system must hold exactly one recovery obligation (E6) for it, folding later triggers into it. It must close only when a scan run whose demand was submitted after its latest trigger completes. A trigger arriving while a submission is in flight must keep the obligation open. *E1, E4–E7. Basis: U3, U7.*\n\n**R3. Debounce.** A change-driven obligation's scan must not be submitted until no new trigger for that folder has arrived for **2 seconds**, except under R4. *E1, E6. Basis: U3, U4.*\n\n**R4. Maximum wait.** If the oldest unserved trigger of an open obligation is **10 seconds** old, its scan must become **eligible** for submission without waiting for quiet. Its actual start remains limited by the existing per-folder single-flight and the global traversal limit. *E1, E6, E7. Basis: U4, U7.*\n\n**R5. Lost events are always reconciled.** If coverage loss (E5) affects a watched folder, then the system must open or fold into its obligation, whatever paths accompany the loss. *E1, E5, E6. Basis: U7.*\n\n**R6. Explicit demands are not debounced.** An explicit scan demand (E8) must keep its current timing. When its run completes and covers an open obligation's triggers, it closes that obligation. *E6–E8. Basis: U7.*\n\n**R7. Stale results are never trusted as absence.** From the moment a membership-relevant trigger or coverage loss is recorded for a watched folder, every earlier scan result for that folder, and every observation depending on it (including an overlapping watched folder's), must be treated as **not authoritative for absence**. That lasts until a scan run submitted after that trigger completes. Positive discoveries from earlier results may still be published. *E1, E2, E4–E7. Basis: U7, workspace_data_architecture 350-356.*\n\n**R8. Scan runs and demands are both observable, separately.** For each watched folder, telemetry must record: each submitted demand (folder tag, reason, obligation wait, folded-trigger count); and each **completed scan run** (folder tag, run generation, which demands it served, duration). Folders are identified by a non-reversible tag, never a path. *E1, E5–E7. Basis: U5.*\n\n## Observable contract\n\n| Situation | What the user and the app observe |\n| --- | --- |\n| Relevant triggers for a folder **as recorded at the app** span D seconds and contain k gaps of 2 s or more | Change-driven scan runs for that span: at most **1 + k + ⌈D / 10⌉**. This bounds the trigger stream the app observes, not the filesystem operation that produced it. Delivery can lag or bunch triggers under load, so one file operation can produce more recorded gaps. |\n| A worktree is created or removed | It appears or disappears after the run that covers its last relevant trigger: about 2–10 s after that trigger reaches the app, plus the run's duration. |\n| A build writes heavily inside a known checkout | No scan run starts for it. |\n| A worktree is restored while an older scan that missed it is still finishing | The older result can't mark it absent; the covering run then confirms it. |\n| The OS reports dropped events | One reconciliation run after the debounce. It's never skipped. |\n| The user adds a watched folder or refreshes manually | Same timing as today. |\n| The folder is unwatched while an obligation is open | The obligation is dropped, and nothing is published for the removed watch. |\n\n**Negative space:**\n- No promise that a change appears in the sidebar within less than 2 s.\n- No ordering across folders.\n- No promise of when a run actually starts once it's eligible, beyond the existing single-flight and the 2-traversal limit.\n- No change to Git working-tree status refresh.\n- The tiers and the daemon are out of scope here.\n\n## Cross-cutting obligations\n\n- **Performance:** for the V9 workload, the trigger-trace run bound holds, and coarse watched-folder recoveries drop by at least 90% against v0.0.124 on the same workload.\n- **Reliability:** no coverage loss goes unreconciled (R5), and no stale negative evidence is used (R7).\n- **Privacy:** folder tags only (R8).\n- **Main thread:** no new main-actor work.\n- **Security, accessibility, compatibility:** not applicable; there's no new external surface or persisted format.\n\n## Proof obligations\n\n| ID | Obligation | Decides pass or fail | Reference |\n| --- | --- | --- | --- |\n| V1 | R1 | Through both an accepted and a saturated intake (drops forced, more than 256 paths): routine content and ordinary files inside a known checkout, and directories deeper than the scanner's depth or under a hidden directory, start **0** runs. Each positive control still starts one: a new Git marker; a removed or renamed checkout root; a new candidate directory outside known checkouts within depth; `HEAD`, `config`, `commondir`, an unknown `.git` entry; removal of `objects/`. | E4 (the existing rule's tests at `WatchedFolderTopologyAdmissionTests` 60-133) |\n| V2 | R2 | Triggers across many drains and during a running scan give exactly one obligation. A trigger during an in-flight submission keeps it open. A run submitted before the latest trigger doesn't close it. A stale-dropped run's demand still reaches a covering completion. | R2 text |\n| V3 | R3 | With a controlled clock: submission no earlier than 2 s after the last trigger. | U4: \"2s debounce\" |\n| V4 | R4 | With a controlled clock and a trigger every 1 s for 60 s: a submission becomes eligible at every 10 s of age, with at most ⌈60/10⌉+1 = 7 submissions in total. | U4: \"max wait of 10s\" |\n| V5 | R5 | An OS dropped-events signal with only in-checkout paths opens exactly one obligation, giving one run. | Apple FSEvents guide; U7 |\n| V6 | R6 | Add-folder and manual refresh submit at t+0, and their completed run closes a covered obligation. | current behavior |\n| V7 | R7 | Hold a real scan after it passes a candidate directory, restore the candidate, record the trigger without advancing the clock, and complete the old scan: neither its own receipt nor an overlapping one certifies absence. After the covering run, authority returns. A non-overlapping root is unaffected. | workspace_data_architecture 350-356 |\n| V8 | R8 | Demand and run records are both present, with the listed fields and no path in any value. | U5 |\n| V9 | Performance | On the V9 workload (fixture worktree removal and creation), completed change-driven runs per folder are within **1 + k + ⌈D / 10⌉** computed from that folder's **recorded** trigger trace, including trailing runs until the obligation closes. The workload is valid only when the fixture's membership change is published, telemetry for the window is present, and the v0.0.124 baseline shows coarse recoveries for the same fixture. Coarse recoveries are at least 90% below that baseline. A cancelled run with no result isn't counted, and that's stated as a limit. | v0.0.124 telemetry; R3/R4 |\n\n## Requirement coverage\n\n| U | E | P | O | R | V |\n| --- | --- | --- | --- | --- | --- |\n| U1, U2 | E1–E4, E7 | P1 | O1 | R1 | V1, V9 |\n| U3, U7 | E1, E4–E7 | P1, P2 | O2, O3 | R2 | V2 |\n| U3, U4 | E1, E6 | P2 | O2 | R3 | V3 |\n| U4, U7 | E1, E6, E7 | P2 | O2, O3 | R4 | V4 |\n| U7 | E1, E5, E6 | — | O3 | R5 | V5 |\n| U7 | E6–E8 | — | O3 | R6 | V6 |\n| U7 | E1, E2, E4–E7 | — | O3 | R7 | V7 |\n| U5 | E1, E5–E7 | P3 | O4 | R8 | V8 |\n| U6, U10, U11 | — | — | — | delivery scope | the stopgap boundary above; the daemon spec follows |\n| U8, U9 | — | — | — | — | **daemon spec** (not this document) |\n","reference":"./2026-11-04-fsevents-overload-specification.md"}</script></ex-markdown>

    <ex-markdown id="verification-design" label="Verification Design"><script type="application/json" data-ex-markdown-source="">{"text":"# FSEvents overload: Verification Design (Swift stopgap)\n\nPlans how [the Requirements](2026-11-04-fsevents-overload-requirements.md) in this delivery are shown to hold. It uses the obligations in [the Specification](2026-11-04-fsevents-overload-specification.md) and the seams in [the Program Design trace table](2026-11-04-fsevents-overload-program-design.md#trace-table). This is a plan: nothing in it has been run or observed. The tiers (U8) and the platform-neutral source (U9) are proven by the daemon spec, not here.\n\n## Proven by\n\n| Requirement | Proven by | Stays unverified |\n| --- | --- | --- |\n| **U1** \"don't do excess work walking the tree\" | A debug build watches disposable repositories. We remove and create a fixture worktree inside the watched folder, then compare completed scan runs against the bound computed from the **recorded trigger trace** (1 + k + ⌈D/10⌉). Coarse recoveries must be at least 90% below v0.0.124 on the same workload. | The owner's real ~270-registration workspace isn't replayed. Cancelled runs with no result aren't counted. |\n| **U2** \"don't look at files that don't matter\" | Bursts of more than 256 routine changes inside a known checkout, plus folders the scanner never visits (too deep, under hidden directories), go through both a normal and a saturated intake: **no scan run**. The positive controls still start one: a new `.git` marker, a removed worktree, a new candidate folder, a `HEAD`/`config`/`commondir` change, and an unknown `.git` entry. | — |\n| **U3** \"admission, then a debounce\" | Against a controlled clock, many triggers, including some during an in-flight submission and some during a running scan, leave **one** obligation per folder. It closes only when a run submitted after the last trigger completes. | — |\n| **U4** \"2s debounce, max wait 10s\" | Against a controlled clock: no submission sooner than 2 s after the last change. Under a trigger every second for a minute, one becomes eligible every 10 s, and never later. | Wall-clock timing on a loaded machine. |\n| **U5** \"logging and tracing\" | Telemetry from the workload shows **demand** records (reason, wait, folded triggers) and **run** records (run generation, duration), with no paths. | — |\n| **U6** full fix | Every row passes on the delivered PR's head. | The daemon part is proven by its own spec. |\n| **U7** discovery stays correct | A restored worktree is never marked gone by an older scan. Lost OS events still produce one run. Adding a folder or refreshing is immediate. The existing discovery tests still pass, with the adaptations listed below. | Nested-repository edge cases beyond the scanner's current rules. |\n\n## Coverage rows\n\n### Shared observation A: controlled-clock watched-folder actor\n\n`FilesystemActor` runs on `TestPushClock` with the fake stream client from `WatchedFolderActorFixture` (`Tests/AgentStudioTests/Core/PaneRuntime/Sources/FilesystemActorWatchedFolderTests.swift`). It drives the real `WatchedFolderScanScheduler`, `WatchedFolderScanPacing` and `WatchedFolderTopologyAdmission`, and observes demand submissions with their clock times, results applied, the newest-demand marker, and `watched_scan_demand` / `watched_scan_run` records through a recorder fake. **Case additions needed:**\n- the fixture must be constructible with `TestPushClock`;\n- it must expose a submission log;\n- it must let a test hold the scheduler's result for one run;\n- it reuses the existing **acceptance gate** (`FilesystemActorWatchedFolderTestSupport.swift:99-129`), which submits to the real scheduler and then holds the reply, so tests can order acceptance and result either way.\n\n### Shared observation B: real-scanner currentness\n\nThis reuses `WatchedFolderObservationCurrentnessTests` (`Tests/AgentStudioTests/Integration/`). It already builds a real `FilesystemActor` over temporary roots and checks dependent-observation invalidation, using controlled scheduler results. **Case addition needed:** a production `RepoScanner` run held after it passes a candidate directory, so the stale-absence window crosses real traversal.\n\n### Shared observation C: watched-folder burst workload (performance)\n\n**`needed:` a lasting journey.** It's a sibling of `verify-git-refresh-performance-workload` (observability doc, \"Performance workload\"):\n- disposable fixture repositories and worktrees under one watched folder;\n- the declared debug build launched through `run-debug-observability`;\n- one fixture worktree removal and one creation;\n- marker-scoped VictoriaLogs and Metrics queries for the folder's `watched_scan_obligation` closed records (its `spanMs`, `quietGapCount` and attributed run count), the `watched_scan_demand` and `watched_scan_run` records joined on `obligationOrdinal` and `submissionSequence`, and `stage_outcome` coarse recoveries. The window ends at obligation closure, so trailing runs are included.\n\n**Validity preconditions:** the run is valid only when the fixture's membership change is published, telemetry for the whole window is present, and the v0.0.124 baseline shows coarse recoveries for the same fixture. A missing or empty telemetry stream is a failed run, not a passing \"≤ bound\".\n\nThe same fixture runs once against v0.0.124 for the baseline. **Lifetime: lasting.** Any later ingress or pacing change can bring the storm back.\n\n| U | R | Seam | Observation | Target / reused test | Passes when | Wrong build that fails it | Unverified |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| U1 U2 | R1 | `filterBatch` pure; stream client with injected stream factory and a capacity-1 buffer; A | yielded batches; runs started | extends `WatchedFolderTopologyAdmissionTests` (routine `:60-91`, discovery-sensitive `:93-133`, held paths `:288`, overflow `:321-376`) over the snapshot, plus a client test that holds an old snapshot during root removal, a new checkout and a hold release | Routine content, ordinary files, too-deep folders and folders under hidden directories yield no batch and start 0 runs on both paths. Each positive control in Specification V1 yields a batch and starts 1 run. | a build filtering only accepted batches; a build dropping `HEAD` or `commondir`; a build treating `.git` itself as hidden | the real kernel's event shapes beyond the injected factory |\n| U3 U7 | R2 | reducer; submission protocol; A with the acceptance gate | obligation state; which result closes it; marker | focused reducer test, plus A | 50 triggers over 10 drains give 1 obligation. A trigger during the submission await keeps it open, and the marker stays cleared. A run submitted before the last trigger doesn't close it. A stale-dropped run's demand reaches a later covering completion, which closes it. **Both orders, with no later trigger:** acceptance-then-result and result-then-acceptance each make the covering result authoritative once and close the obligation once. **Both orders, with a later trigger:** each keeps the pending interval. **Two demands, same revision:** with A (seq 1) submitted and its result held, an explicit B (seq 2) accepted, and then A's result released, A applies positive-only, the marker stays at B's coverage, B's work stays open, and only B's result restores authority. | a build closing on submission; a build ignoring a result that arrives before its acceptance (it never closes); a build counting the covering result twice; a build letting an older result move the marker back below a newer accepted demand | — |\n| U3 U4 | R3 | reducer `decision(at:)`; A | submission times on `TestPushClock` | focused reducer test, plus A | A trigger at t=0 with none after gives a submission at t=2 s, not before. Triggers at t=0 and t=1.5 give t=3.5. | an undebounced build that submits at t=0 | wall clock under load |\n| U4 U7 | R4 | reducer maximum-wait branch; A | submission eligibility under a sustained burst | focused reducer test, plus A | With a trigger every 1 s for 60 s, an eligible submission occurs at each 10 s of oldest-trigger age, at most 7 in total. Eligibility isn't delayed by quiet. | a pure trailing debounce (0 during the burst); a build with no maximum wait | actual start time under a long single-flight run (by design, eligibility only) |\n| U7 | R5 | `filterBatch` coverage loss; actor overflow path; A | runs after a loss signal | focused test, plus A (adapts `FilesystemActorWatchedFolderTests:11`) | A `UserDropped` signal with only in-checkout paths, and a coarse intake recovery, each open 1 obligation and give 1 run after the debounce. | a build that filters coverage loss as irrelevant | real `KernelDropped` timing |\n| U7 | R6 | actor explicit path; A with the acceptance gate | submission times; marker; obligation closure | A | `initialAdd`, `manual` and `fallback` submit at t+0, and their completed run closes a covered obligation. **Race:** hold a manual (tracked) and a fallback (untracked) acceptance, record a relevant trigger, then release: the marker stays cleared. **Control:** with no later trigger, the explicit acceptance sets the marker as today. | a build debouncing explicit demands; a build restoring the marker on an explicit acceptance after a newer trigger (the review's F1) | — |\n| U7 | R7 | the newest-demand marker; B with the acceptance gate | the authority of own and overlapping receipts | B (extended), plus `WatchedFolderPublicationHoldIntegrationTests` (adapted: its `:83-93` admission check moves after the debounce; its hold semantics are unchanged) | After a late trigger, with the clock **not** advanced, and also when an explicit acceptance arrives after that trigger: the old run's result applies positive-only, and neither source A's old receipt nor overlapping source B's old receipt B(g) is current. After A's covering run, the **fresh** A receipt is authoritative, while B(g) **stays stale**. A newly produced B receipt from an ordinary B scan can then be current. A non-overlapping root's authority is unaffected throughout. | a build clearing the marker only at submission; a build letting an old acceptance restore it; a build that rebases B(g) onto A's new generation | — |\n| U5 | R8 | recorder fake in A; Victoria in C | demand, run and obligation records | A, plus C | Every accepted demand has tag, obligation and interval ordinals, reason, first and last trigger offsets, quiet-gap count, folded count, `obligationWaitMs` and submission sequence. Under a controlled clock, `obligationWaitMs` equals submission time minus open time exactly. Every completed run has tag, run generation, the covered submission sequence and duration. Every closed obligation has span, quiet-gap count, its closing run and attributed run count. Under a controlled clock, those values equal the reducer's recorded triggers exactly. No value contains a path separator or a fixture name. | a build counting submissions as runs; a build logging paths | — |\n| U1 | performance (V9) | C | completed runs through obligation closure, against the bound from the recorded trigger trace; coarse recoveries against the baseline | C, against the PR head's debug build and against v0.0.124 | Completed change-driven runs ≤ 1 + k + ⌈D/10⌉, computed from that folder's recorded triggers (D = their span, k = gaps of 2 s or more). The validity preconditions hold. Coarse recoveries are at least 90% below the v0.0.124 run on the same fixture. Delivery gaps between the file operation and the recorded triggers are reported, not hidden. | current main (v0.0.124 behavior); a correct-policy build whose telemetry is missing (invalid run) | the owner's real workspace size; other volumes; cancelled runs without a result |\n| U6 | all | documents and PR | structural | the four documents' trace; the PR's gate | Every R1–R8 row passes on the PR head, and `mise run test` passes there. | — | the daemon part |\n\n### Tests whose expectations change, and how\n\n- **Scan-start timing assertions** that today expect an immediate scan after a callback or overflow (for example, `FilesystemActorWatchedFolderTests` \"one ingress batch records multiple watched overflow admissions once\") move to after the debounce deadline on `TestPushClock`. They keep their counts. This is the intended R3 change.\n- **Validity or invalidation assertions** (for example, `WatchedFolderObservationCurrentnessTests:36-42`) **stay immediate**. Under R7, invalidation happens at the trigger, not at submission, so these must not move after the deadline. Moving them would weaken the proof.\n","reference":"./2026-11-04-fsevents-overload-verification-design.md"}</script></ex-markdown>
