<h1>FSEvents overload design (LUNA-581)</h1>
<p>The Program Design tab opens on today's pipeline next to the target, and on why the target is better. The other tabs hold the Requirements, the Specification and the proof plan. Each tab renders its source Markdown document directly.</p>
<ex-tabs label="Design documents" data-width="canvas">
  <section label="Program Design: today vs target">
    <ex-markdown id="program-design" label="Program Design"><script type="application/json" data-ex-markdown-source="">{"text":"# FSEvents overload: Program Design\n\nRealizes [the Specification](2026-11-04-fsevents-overload-specification.md) (R1–R8 over E1–E8), authorized by [the Requirements](2026-11-04-fsevents-overload-requirements.md). Proof strategy: [the Verification Design](2026-11-04-fsevents-overload-verification-design.md). Source anchors are at `main` `e196a7ec6`, under `Sources/AgentStudio/Core/RuntimeEventSystem/Filesystem/` unless stated otherwise.\n\n## What changes: four blocks\n\nEvery file change passes through four blocks. The fix changes what happens **inside** each block, not the order of the blocks.\n\n```mermaid\nflowchart LR\n  ev([\"file changes\"]) --> F[\"1. FILTER\u003cbr/>does this change matter?\"]\n  F --> A[\"2. ADMISSION\u003cbr/>one open obligation per folder\"]\n  A --> D[\"3. DEBOUNCE\u003cbr/>wait for quiet, cap at 30 s\"]\n  D --> S[\"4. SCAN\u003cbr/>walk the folder once\"]\n  S -.->|\"finished: new known checkouts\"| F\n```\n\n| Block | Today | Target |\n| --- | --- | --- |\n| **1. Filter** | Removes only Git's private staging paths. Every build file still enters the 512-slot queue. | Drops changes strictly inside known checkouts **before** the queue, using the same rule that admission uses. Lost-event signals always pass. |\n| **2. Admission** | The rule is right for accepted batches. On overflow, a weaker rule treats any directory change as relevant. | One rule everywhere. Every relevant change opens or folds into the folder's single obligation. |\n| **3. Debounce** | **None.** Scans are submitted immediately, and follow-ups start back to back. | Per folder: 2 s of quiet and 2 s after the previous scan, or forced at 30 s. Explicit demands (add folder, refresh) skip it. |\n| **4. Scan** | Single-flight and at most 2 traversals. | Unchanged. |\n\n### Block 1: Filter\n\n```mermaid\nflowchart LR\n  subgraph today1[\"Today\"]\n    t1[\"FSEvents callback\"] --> t2[\"remove Git staging paths\"] --> t3[\"queue (512)\"]\n  end\n  subgraph target1[\"Target\"]\n    n1[\"FSEvents callback\u003cbr/>0.1 s native batching\"] --> n2[\"filterBatch over the snapshot\u003cbr/>keep: relevant paths, lost-event signals\"]\n    snap[\"snapshot: known checkouts + holds\u003cbr/>pushed by FilesystemActor\"] -.-> n2\n    n2 -->|kept| n3[\"queue (512), now small\"]\n    n2 -->|inside a known checkout| n4[\"dropped, no queue slot\"]\n  end\n```\n\n**Why the debounce sits after the filter, not in it:** the filter has to see every event, because a debounce keeps only the latest and could drop the one event that matters, such as a `.git` marker appearing mid-build. The filter is cheap per event, and FSEvents already batches callbacks at 0.1 s. Waiting pays off only in front of the expensive step, the scan, after the filter has shrunk the input. That's the Selection Rule's order: classify the input, then choose the mechanism.\n\n### Block 2: Admission\n\n```mermaid\nflowchart LR\n  subgraph today2[\"Today\"]\n    a1[\"accepted batch\"] --> a2[\"shouldScan\u003cbr/>correct rule\"] --> a5[\"submit now\"]\n    a3[\"dropped batch\u003cbr/>over 256 paths\"] --> a4[\"mayAffectTopology\u003cbr/>any dir change\"] --> a5\n  end\n  subgraph target2[\"Target\"]\n    b1[\"accepted batch\"] --> b2[\"shouldScan\u003cbr/>same rule\"] --> b4[\"recordTrigger\u003cbr/>open / fold obligation\"]\n    b3[\"dropped batch\u003cbr/>already filtered\"] --> b4\n  end\n```\n\n### Block 3: Debounce\n\n```mermaid\nflowchart LR\n  subgraph today3[\"Today\"]\n    c1[\"submit\"] --> c2[\"runs at once\"] --> c3[\"finishes\"] --> c4[\"dirty follow-up\u003cbr/>runs at once\"]\n  end\n  subgraph target3[\"Target\"]\n    d1[\"obligation open\"] --> d2{\"2 s quiet AND\u003cbr/>2 s since last scan?\"}\n    d2 -->|yes| d4[\"submit\"]\n    d2 -->|no| d3{\"oldest change\u003cbr/>30 s old?\"}\n    d3 -->|yes| d4\n    d3 -->|no| d1\n  end\n```\n\n### Block 4: Scan\n\nUnchanged: `WatchedFolderScanScheduler` keeps per-folder single-flight, one merged follow-up and at most 2 concurrent traversals. A finished scan feeds back in two ways: it updates the known-checkout snapshot the Filter uses, and its completion time feeds the Debounce's \"2 s since last scan\" rule.\n\n\u003cdetails>\n\u003csummary>The full target pipeline in one drawing (all blocks, with code owners)\u003c/summary>\n\n```mermaid\nflowchart TD\n  os[\"FSEvents callback\u003cbr/>one stream per volume, 0.1 s native batching\"]\n  subgraph filter[\"1. FILTER: every event, stateless, no delay\"]\n    classify[\"StreamClient.emitRawEvents\u003cbr/>+ TopologyAdmission.filterBatch\"]\n    snap[\"WatchedFolderAdmissionSnapshot\u003cbr/>known checkouts + holds\"]\n    dropped[\"churn inside known checkouts\u003cbr/>not enqueued\"]\n    snap -.->|read under lifecycleLock| classify\n    classify --> dropped\n  end\n  buf[\"IngressBuffer, 512 batches, unchanged\u003cbr/>now carries only relevant paths + coverage loss\"]\n  subgraph admission[\"2. ADMISSION: one obligation per folder\"]\n    should[\"TopologyAdmission.shouldScan\u003cbr/>same rule, same snapshot\"]\n    rec[\"Overflow recovery\u003cbr/>only relevant paths retained\"]\n    obligation[\"WatchedFolderScanPacing.recordTrigger\u003cbr/>open or fold into the folder's obligation\"]\n    should --> obligation\n    rec --> obligation\n  end\n  subgraph debounce[\"3. DEBOUNCE: per folder\"]\n    decide[\"decision(at:)\u003cbr/>2 s quiet AND 2 s after last scan\u003cbr/>OR forced at 30 s\"]\n  end\n  subgraph scan[\"4. SCAN: unchanged\"]\n    sched[\"WatchedFolderScanScheduler\u003cbr/>single-flight, max 2 traversals\"]\n    apply[\"FilesystemActor applies result\"]\n    sched --> apply\n  end\n  explicit[\"initialAdd / manual / fallback\u003cbr/>bypass debounce\"]\n  os --> classify\n  classify -->|\"relevant + coverage loss\"| buf\n  buf -->|accepted| should\n  buf -->|dropped| rec\n  obligation --> decide\n  decide -->|eligible| sched\n  explicit --> sched\n  apply -->|completion time| decide\n  apply -->|inventory changed| snap\n```\n\n\u003c/details>\n\n### Why this is better\n\n| | Today | Target |\n| --- | --- | --- |\n| A build inside a known checkout (100k+ changes) | fills the intake; on overflow, becomes \"rescan the whole folder\", over and over | filtered at the source; uses no intake slot; **0 scans** |\n| A worktree created or removed | about 59k recovery records in 10 min; back-to-back scans | one obligation; scanned **once** after 2 s of quiet, at most once more if the burst outlasts 30 s |\n| A continuous 10-minute burst of new checkouts | back-to-back scans for the whole burst | about one scan every 30 s |\n| OS reports dropped events | immediate scan, then a follow-up for every burst after it | one paced scan; never skipped |\n| User adds a folder or refreshes | immediate | immediate, unchanged |\n| Measuring it | recovery records only | each scan logged with reason, wait and folded-trigger count |\n\nThe fix applies the rule the architecture doc already states (\"directory changes inside a known checkout do not request a full scan\"). It applies it where the loss happens, and reuses a debounce the codebase already trusts. The scheduler, where the separate crash (LUNA-514) lives, isn't touched.\n\n## Structure decision\n\n**Selected:** relevance moves to the source, and pacing goes in `FilesystemActor`.\n- **Source relevance:** the stream client filters watched-folder batches with the existing topology rule, against an immutable snapshot that `FilesystemActor` publishes.\n- **Pacing:** a per-folder debounce, modeled on the Git-lane debounce at `FilesystemActor.swift:525-657`.\n- **Explicit demands** stay immediate.\n- **The scheduler** is unchanged.\n\n| Alternative | Why not |\n| --- | --- |\n| Pacing inside `WatchedFolderScanScheduler` (a future `readyAt` plus a deadline task) | The architecture doc assigns debounce to `FilesystemActor` (workspace_data_architecture 420-430). The proven debounce pattern lives there. The scheduler is under an open corruption investigation (LUNA-514), and adding time state to its `SchedulingStateStore` touches exactly that code. |\n| Keep the topology relevance only through overflow, with no source filter | R1 would hold under overload, but irrelevant churn would still take up intake slots and push out relevant batches. That keeps the 274-registration fan-out pressure. |\n| Retain recovery records across drains inside `IngressBuffer` (as first proposed) | Redundant: the pacer's per-folder obligation is the one durable home for recovery intent (E6), and the buffer's record stays transport only. |\n| Native FSEvents exclusions, a larger buffer, or a longer stream latency | Non-goals. They move pressure around without fixing what the overflow path does. |\n\n**Cost:**\n- One new interface method on `FSEventStreamClient`; its test fakes change.\n- One new pure reducer and one deadline task in `FilesystemActor`.\n- Per-callback prefix checks on the FSEvents dispatch queue.\n- Discovery of a new checkout during churn waits up to 2–30 s.\n\n**What would reopen the choice:**\n- Post-change telemetry shows more than 2 watched-folder scans per worktree create/remove.\n- The source filter measurably costs callback time: over 1 ms median per callback in the ingress snapshot.\n- A missed discovery appears that's traceable to a stale snapshot.\n\n## Entities and where they live\n\n| E | Semantic owner | Home (`new`/`modified`/`existing`) | Type home | Shape at boundaries | Kind | Convention |\n| --- | --- | --- | --- | --- | --- | --- |\n| E1 Watched folder | `FilesystemActor` | existing: `watchedFolderScanState.registrationsBySourceID` | `FilesystemSourceID`, `FilesystemWatchedFolderRegistration` | `FilesystemSourceID` to the scheduler; legacy routing `UUID` to the stream client (`sourceIDByLegacyCallbackRoutingID`) | persisted (watch list) | existing |\n| E2 Known checkout | `FilesystemActor` (inventory) | existing: `inventoryBySourceID[...].repoGroups`. **New:** projection `WatchedFolderAdmissionSnapshot` | `RepoScanner.RepoScanGroup`; new `WatchedFolderAdmissionSnapshot` in `WatchedFolderTopologyAdmission.swift` | `WatchedFolderAdmissionSnapshot { canonicalRoot: String, lexicalRoot: String, casePolicy: FilesystemVolumeCasePolicy, knownCheckoutPaths: Set\u003cString> /* comparison form, holds included */ }`, a `Sendable` value from actor to client | derived | Swift value types, `Sendable` |\n| E3 File change | OS, via `DarwinFSEventStreamClient` | existing | `FSEventBatch`, `FSEventObservation` | unchanged | transient | existing |\n| E4 Membership-relevant change | `WatchedFolderTopologyAdmission` (sole rule owner) | modified: `shouldScan` and `mayAffectTopology` re-expressed over the snapshot | new closed enum `WatchedFolderPathRelevance { case relevant, irrelevant }`, plus `filterBatch(_:snapshot:) -> FSEventBatch?` | an `FSEventBatch` with only relevant paths and observations, or `nil` | derived | pure static functions, as today |\n| E5 Coverage loss | `DarwinFSEventStreamClient` / `DarwinFSEventIngressBuffer` | existing | `FSEventObservation.hasCoverageLoss`, `FSEventOverflowRecovery` | unchanged | transient | existing |\n| E6 Recovery obligation | `FilesystemActor` | **new**: `WatchedFolderScanPacing` in `FilesystemActor+WatchedFolderScanPacing.swift`, held in `watchedFolderScanState.pacing` | `struct WatchedFolderScanPacing`, `struct PacedScanObligation { firstUnservedTriggerAt: Duration; lastTriggerAt: Duration; foldedTriggerCount: Int; reasons: WatchedFolderScanTriggerReasons }` | none: it never crosses an actor boundary | in-memory | mirrors `PendingWorktreeChanges` |\n| E7 Scan | `WatchedFolderScanScheduler` | existing, unchanged | `WatchedFolderScanRequest`, `WatchedFolderScanCause` | unchanged | in-memory | existing |\n| E8 Explicit scan demand | `FilesystemActor` | existing | `WatchedFolderScanCause.initialAdd`, `.manual`, `.fallback` | unchanged | — | existing |\n\nPolicy constants (`AppPolicies.WatchedFolderScanning`, modified): `changeQuietPeriod = .seconds(2)`, `minimumGapAfterScan = .seconds(2)`, `maximumChangeDeferral = .seconds(30)`. These are behavior, so they're policies and not styles.\n\n## Components\n\n```mermaid\nflowchart LR\n  subgraph intake[\"Intake (FSEvents dispatch queue)\"]\n    client[\"DarwinFSEventStreamClient\u003cbr/>modified: holds snapshots, filters watched-folder batches\"]\n    buffer[\"DarwinFSEventIngressBuffer\u003cbr/>unchanged\"]\n  end\n  subgraph actor[\"FilesystemActor\"]\n    ws[\"+WatchedFolderScanning\u003cbr/>modified: routes triggers to the pacer, publishes snapshots\"]\n    pacing[\"+WatchedFolderScanPacing\u003cbr/>new: obligation reducer + deadline task\"]\n    apply[\"+WatchedFolderResultApplication\u003cbr/>modified: reports completion, refreshes snapshot\"]\n  end\n  rule[\"WatchedFolderTopologyAdmission\u003cbr/>modified: one rule over a snapshot\"]\n  sched[\"WatchedFolderScanScheduler\u003cbr/>unchanged\"]\n  client --> buffer --> ws\n  client -. uses .-> rule\n  ws -. uses .-> rule\n  ws --> pacing --> sched\n  sched --> apply --> pacing\n  apply --> client\n```\n\n| Component | Job | Owns | Consumers | Reason to change |\n| --- | --- | --- | --- | --- |\n| `WatchedFolderTopologyAdmission` | decides membership relevance | the only relevance rule (E4) | stream client, `FilesystemActor` | the discovery contract changes |\n| `DarwinFSEventStreamClient` | turns callbacks into batches | the latest admission snapshot per watched-folder registration | ingress buffer | the intake shape changes |\n| `WatchedFolderScanPacing` | decides when a change-driven scan may be submitted | E6, one open obligation per folder | `FilesystemActor+WatchedFolderScanning` | the pacing policy changes |\n| `FilesystemActor+WatchedFolderScanning` | receives triggers, submits scans | trigger routing; snapshot publication | ingress loop, result application | scan admission changes |\n| `WatchedFolderScanScheduler` | runs scans, with single-flight and the concurrency limit | E7 | `FilesystemActor` | unchanged here |\n\n**Forbidden edges:**\n- The stream client never calls the actor. It only reads an immutable snapshot the actor pushed.\n- The pacer never touches the scheduler's state.\n- No path or file name goes into telemetry.\n\n## Interfaces\n\n**`FSEventStreamClient.updateWatchedFolderAdmission(worktreeId: UUID, snapshot: WatchedFolderAdmissionSnapshot?)`** (new requirement on the protocol)\n- Replaces the snapshot for one watched-folder registration atomically, under `lifecycleLock`.\n- `nil` clears it, so that registration's batches are unfiltered, as today.\n- Takes effect for callbacks that start after it returns. A callback already running may use the previous snapshot.\n\n**`WatchedFolderTopologyAdmission.filterBatch(_ batch: FSEventBatch, snapshot: WatchedFolderAdmissionSnapshot) -> FSEventBatch?`** (new; pure)\n- Keeps every observation with `hasCoverageLoss` and every path or observation that `shouldScan` would count. Returns `nil` when nothing remains.\n- `shouldScan(_:snapshot:)` becomes `filterBatch(...) != nil`, so there is one rule.\n- `mayAffectTopology` stays for already-filtered retained recoveries. Their paths are relevant by construction.\n\n**`WatchedFolderScanPacing`** (new; pure reducer, fed explicit `now` values):\n\n```swift\nmutating func recordTrigger(_ sourceID: FilesystemSourceID, reason: WatchedFolderScanTriggerReason, at now: Duration)\nmutating func recordSubmission(_ sourceID: FilesystemSourceID, at now: Duration)   // the obligation is served\nmutating func recordCompletion(_ sourceID: FilesystemSourceID, at now: Duration)\nmutating func removeFolder(_ sourceID: FilesystemSourceID)\nfunc decision(at now: Duration) -> WatchedFolderPacingDecision\nenum WatchedFolderPacingDecision: Equatable { case submit([FilesystemSourceID]), wait(until: Duration), idle }\nenum WatchedFolderScanTriggerReason: Equatable { case relevantChange, nativeCoverageLoss, intakeCoverageLoss }\n```\n\n**Eligibility, for each folder with an open obligation:**\n\n- **(a) Paced:** `now ≥ lastTriggerAt + changeQuietPeriod`, and `now ≥ lastCompletedAt + minimumGapAfterScan`, and no submitted scan is still awaiting its result.\n- **(b) Forced:** `now ≥ firstUnservedTriggerAt + maximumChangeDeferral`, whatever is in flight. The scheduler's existing single-flight merges it into the running scan's dirty follow-up.\n\n## The main path, step by step\n\n**Trigger to obligation**\n1. An FSEvents callback runs `DarwinFSEventStreamClient.emitRawEvents` (`DarwinFSEventStreamClient.swift:619-650`).\n2. For a registration that has a snapshot, `filterBatch` runs first. A `nil` result means **no yield**.\n3. A surviving batch, carrying only relevant paths and coverage-loss observations, reaches `ingressBuffer.yield`. That's unchanged.\n4. The `FilesystemActor` ingress loop calls `handleWatchedFolderFSEvent` (`FilesystemActor+WatchedFolderScanning.swift:161`). `shouldScan(batch, snapshot)` is true there, so it calls `pacing.recordTrigger(.relevantChange or .nativeCoverageLoss)` and schedules the pacing deadline. **It doesn't submit.**\n5. An overflow recovery for a watched folder (`FilesystemActor.swift:456-483`) takes the same route. Retained paths go to `handleWatchedFolderFSEvent`. A coarse recovery calls `recordTrigger(.intakeCoverageLoss)` in place of `handleCoarseWatchedFolderFSEvent`'s direct submit.\n\n**Deadline to scan**\n\n6. The pacing task sleeps on `schedulingClock` until the decision's `wait(until:)`. It's one reschedulable task, the same pattern as `drainPendingChanges` (`FilesystemActor.swift:525-570`).\n7. On `.submit(ids)`, each source calls the existing `submitWatchedFolderScan(cause: .callback)`. On `.accepted` comes `recordSubmission`, and the `watched_scan` telemetry record with phase `submitted`.\n8. The scheduler runs it, as today.\n\n**Result to pacer**\n\n9. `applyWatchedFolderScanResult` (`FilesystemActor+WatchedFolderResultApplication.swift:98`) calls `pacing.recordCompletion`.\n10. When `inventoryBySourceID` changed (`:139-152`), it rebuilds `WatchedFolderAdmissionSnapshot` and calls `updateWatchedFolderAdmission`.\n11. It records `watched_scan` with phase `completed`.\n\n**Explicit demands:** `initialAdd`, `manual` and `fallback` submit immediately, as today, then call `recordSubmission`, which closes any open obligation the scan covers (R6).\n\n**Holds:** a change to `publicationHoldPathsByID` republishes the snapshot, because held paths count as known checkouts. Registration and unregistration publish or clear the snapshot, and `removeFolder` drops the obligation.\n\n## The obligation's lifecycle\n\n```mermaid\nstateDiagram-v2\n  [*] --> None\n  None --> Open: recordTrigger\n  Open --> Open: recordTrigger (folds; lastTriggerAt moves)\n  Open --> Submitted: decision = submit (paced or forced) / explicit demand\n  Submitted --> Open: recordTrigger after submission (new interval)\n  Submitted --> None: recordCompletion with no new trigger\n  Open --> None: removeFolder (unwatched)\n  Submitted --> None: removeFolder\n```\n\n**Illegal states:**\n- Two open obligations for one folder can't exist: it's a dictionary keyed by `FilesystemSourceID`.\n- A scan submitted before a trigger can't close that trigger: `recordTrigger` after `recordSubmission` reopens the obligation.\n\n## Failure, recovery and concurrency\n\n| Situation | Detection | Behavior | Owner |\n| --- | --- | --- | --- |\n| A stale snapshot (a new checkout isn't in it yet) | — | Changes inside the new checkout count as relevant, so an extra paced scan runs. That errs toward safety. | `TopologyAdmission` |\n| A stale snapshot (a removed checkout is still in it) | — | The root's own removal or rename isn't \"strictly inside\", so it stays relevant and triggers a scan. | `TopologyAdmission` |\n| A callback races a snapshot update | — | It uses either snapshot. Both are safe, by the two rows above. | stream client |\n| A submitted scan never yields a result (stale drop, cancellation) | none needed | The forced rule (b) ignores in-flight, so a scan still happens within 30 s. The worst case is one forced scan per 30 s per folder. | `WatchedFolderScanPacing` |\n| The scheduler rejects a submission (shutdown, generation exhausted) | `.rejected` | The obligation stays open. Shutdown clears all pacing state and cancels the task. | `FilesystemActor` |\n| The pacing task sleep fails | thrown error | It's logged and rescheduled, as in `drainPendingChanges`. | `FilesystemActor` |\n| OS coverage loss arrives with only in-checkout paths | `hasCoverageLoss` | Always kept by `filterBatch`, so the obligation opens (R5). | `TopologyAdmission` |\n| The folder is unwatched while an obligation is open | registration removal | `removeFolder`; nothing is published. | `FilesystemActor` |\n\n**Concurrency:**\n- All pacing state is actor-isolated in `FilesystemActor`.\n- The snapshot is an immutable `Sendable` value. It's handed over under the client's existing `lifecycleLock`, the same lock that guards `streamByWorktreeId`.\n- No new MainActor work.\n- Ordering across folders isn't promised.\n\n## Cross-cutting\n\n- **Performance:** the source filter is O(paths × checkout-path depth) Set lookups on the FSEvents dispatch queue. That's acceptable because it replaces enqueueing those paths at all. The proof is in the ingress snapshot's callback timing, plus V9.\n- **Privacy:** `watched_scan` records carry `diagnosticTag(sourceID)` (the existing process-seeded tag), reason, wait in ms, folded-trigger count and duration. No paths.\n- **Observability (R8):** a new `performance.filesystem.watched_scan` event through the existing `performanceTraceRecorder`, with phase `submitted` or `completed`. Its reason values are `relevantChange`, `nativeCoverageLoss`, `intakeCoverageLoss`, `initialAdd`, `manual` and `fallback`.\n- **Security, accessibility:** not applicable. There's no new input surface.\n\n## Trace table\n\n| U | R | E | Owner | Interface | Shape and home | State | Failure | Proof |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| U1 U2 | R1 irrelevant changes start no scan | E1 E2 E3 E4 E7 | `WatchedFolderTopologyAdmission` + stream client | `filterBatch`, `updateWatchedFolderAdmission` | `WatchedFolderAdmissionSnapshot` (TopologyAdmission.swift) | snapshot per registration (client) | stale snapshot over-scans | seam: `filterBatch` pure; client with injected stream factory + saturated buffer |\n| U3 U7 | R2 one obligation, kept until covered | E1 E4 E5 E6 E7 | `WatchedFolderScanPacing` | `recordTrigger/Submission/Completion` | `PacedScanObligation` (+WatchedFolderScanPacing.swift) | Open/Submitted/None | rejection keeps obligation | seam: pure reducer with explicit `now` |\n| U3 U4 | R3 debounced pacing | E1 E6 E7 | `WatchedFolderScanPacing` | `decision(at:)` | `WatchedFolderPacingDecision` | lastTriggerAt, lastCompletedAt | sleep failure retried | seam: reducer + `FilesystemActor` with injected clock |\n| U4 U7 | R4 bounded delay | E1 E6 E7 | `WatchedFolderScanPacing` | `decision(at:)` forced branch | same | firstUnservedTriggerAt | lost result → forced scan | seam: reducer with explicit `now` |\n| U7 | R5 lost events always reconciled | E1 E5 E6 | `TopologyAdmission` + pacing | `filterBatch` keeps coverage loss; `recordTrigger(.native/.intakeCoverageLoss)` | `WatchedFolderScanTriggerReason` | Open | — | seam: `filterBatch` + actor overflow path with fake client |\n| U7 | R6 explicit demands unpaced | E6 E7 E8 | `FilesystemActor+WatchedFolderScanning` | existing submit + `recordSubmission` | `WatchedFolderScanCause` (existing) | Submitted | — | seam: actor with injected clock + fake scheduler submission |\n| U7 | R7 discovery stays correct | E1 E2 E4 E7 | existing result application (unchanged) | existing | existing | inventory | over-scan only | seam: existing watched-folder admission/application tests extended |\n| U5 | R8 scans observable | E1 E5 E6 E7 | `FilesystemActor` | `performanceTraceRecorder.record(.watchedFolderScan, …)` | attribute set in `AgentStudioOTLPRepoExplorerTaxonomy` | — | recorder fail-open | seam: recorder fake in actor tests; production VictoriaLogs |\n\nDeviations and unresolved decisions: none. The Lead composed \"min 2s / max 30\" into the R3/R4 debounce (Specification R3), and the owner can correct it.\n","reference":"./2026-11-04-fsevents-overload-program-design.md"}</script></ex-markdown>

    <ex-markdown id="requirements" label="Requirements"><script type="application/json" data-ex-markdown-source="">{"text":"# FSEvents overload: Requirements\n\nLinear: [LUNA-581](https://linear.app/askluna/issue/LUNA-581/fsevents-overload-amplifies-watched-folder-rescans). Specification: [2026-11-04-fsevents-overload-specification.md](2026-11-04-fsevents-overload-specification.md).\n\n## Who is affected and what hurts today\n\n**The owner, as the daily user of Agent Studio.** Agents create and remove worktrees, run builds and copy `tmp/` folders inside watched folders around the clock, often while nobody is at the machine. Each of these operations changes 100k+ files at once. The production app (v0.0.124) answers those bursts by rescanning whole watched folders over and over, with nobody using it:\n\n- **Observed:** one worktree removal (about 150k deletes plus 150k copies) produced 59,151 coarse overflow recoveries in 10 minutes. In one hour, 67,827 intake batches were dropped and 66,364 accepted. Source: production VictoriaLogs, `service.version` 0.0.124, 2026-11-04 13:45–14:45 UTC.\n- **Observed:** the Nov 3 crash's fault log shows the scheduler cycling through a scan's candidates continuously, at about 818k transitions in 29 h, while the owner was away.\n- **Cost:** constant background CPU and disk work, and much more exposure for the separate scheduler crash ([LUNA-514](https://linear.app/askluna/issue/LUNA-514)), which happens during this churn.\n\n**Downstream consumers of discovery.** The sidebar's repository and worktree list, and repository retention, rely on watched-folder scans to learn that a checkout appeared, moved or disappeared. They must keep getting correct results.\n\n## What the owner asked for\n\n| ID | Need, in the owner's words | Where it was said | Authority | Priority |\n| --- | --- | --- | --- | --- |\n| U1 | \"make sure we don't do excess work walking the tree\" | chat, 2026-11-04 | authorized | must, owner |\n| U2 | \"make sure that we don't look at files that don't matter. So these are all filters\" | chat, 2026-11-04 | authorized | must, owner |\n| U3 | \"you have to have admission, then a debounce afterwards on how and what the downstream events may happen based on the input\" | chat, 2026-11-04 | authorized | must, owner |\n| U4 | Re-scan pacing: \"min 2s. max 30.\" | page comment `02b7d273`, 2026-11-04 | authorized | must, owner |\n| U5 | \"why the fuck do you not check the logs with code and add logging and tracing?\" The fix must be observable in telemetry. | chat, 2026-11-04 | authorized | must, owner |\n| U6 | \"i want full change and design to properly fix this\": a complete fix of the FSEvents-to-scanner pipeline, not a minimal patch | chat, 2026-11-04 | authorized | must, owner |\n| U7 | Discovery stays correct: a new, moved or removed checkout still reaches the sidebar and retention, and lost events never silently drop a directory move | existing contract, [workspace_data_architecture.md:342-348](../../architecture/state/workspace_data_architecture.md) | authorized (existing normative contract) | must, contract |\n\n## Goal boundary\n\n```mermaid\nflowchart LR\n  bursts[\"Bulk file activity\u003cbr/>agent worktrees, builds, tmp copies\"] --> app([\"Agent Studio\u003cbr/>file-change intake and folder discovery\"])\n  app --> quiet[\"Wanted: background stays quiet\u003cbr/>U1 U2 U3 U4\"]\n  app --> correct[\"Wanted: discovery stays correct\u003cbr/>U7\"]\n  app --> seen[\"Wanted: the reduction is measurable\u003cbr/>U5\"]\n```\n\n- **Goal:** a burst of file activity inside watched folders costs at most a small, bounded number of watched-folder scans. Changes that can't affect discovery cost none. Discovery results stay correct.\n- **Existing foundation to keep:** one physical FSEvents stream per volume, the scheduler's per-folder single-flight with one merged follow-up, at most 2 concurrent traversals, stale-result validation, and the bounded scanner (depth 4, stops at `.git` markers).\n- **What's missing:** irrelevant changes are filtered only after the bounded intake. Overflow recovery skips the known-checkout rule. Recovery intent is cleared on every drain. Follow-up scans have no pacing.\n- **May change:** the filesystem intake and watched-folder scanning code under `Sources/AgentStudio/Core/RuntimeEventSystem/Filesystem/`, with related policy constants and telemetry.\n- **Protected:**\n  - the discovery, retention and negative-space contracts;\n  - the Git working-tree status lane's existing behavior (it must not regress);\n  - the scanner's traversal bounds;\n  - production identity and data.\n- **Acceptable complexity:** changes in the existing owners. A new mechanism is acceptable when Program Design names the rule it satisfies. No new app-wide atoms, bus events or coordinators.\n- **Acceptable evidence:** RED-first tests at the existing owners, plus before/after production-class telemetry for the same worktree create/remove workload.\n\n### Owner deliverable expectations\n\nThe owner asked to see \"what we want to do and why this will be better\" and \"diagram needed\". The Program Design shows the target pipeline next to today's, with diagrams, and the owner review page renders it. This shapes how the design is presented. It isn't product behavior.\n\n## Non-goals\n\n- **Root-causing or fixing the scheduler table corruption (LUNA-514).** That stays a separate investigation. This work only removes the churn it rides on.\n- **Incremental or journal-replay scanning** that avoids whole-folder scans for path-scoped changes. That's a separate design.\n- **Changing the Git working-tree status refresh cadence.** Burst pressure on that lane (observed: 258 pending status requests) is a candidate follow-up, not part of this change.\n- **Globally ignoring `.git`, `node_modules`, `tmp` or build directory names**, which would hide newly created repositories in a watched folder.\n- **Gating watched-folder scans on what's visible.** A watched folder is a standing subscription.\n- **Raising the queue size or the FSEvents latency** as the fix.\n","reference":"./2026-11-04-fsevents-overload-requirements.md"}</script></ex-markdown>

    <ex-markdown id="specification" label="Specification"><script type="application/json" data-ex-markdown-source="">{"text":"# FSEvents overload: Specification\n\nAuthorized by [the Requirements](2026-11-04-fsevents-overload-requirements.md) (U1–U7). Realized by [the Program Design](2026-11-04-fsevents-overload-program-design.md); proven per [the Verification Design](2026-11-04-fsevents-overload-verification-design.md).\n\n## The problem in observable terms\n\n| ID | Today | Who pays | Where it's observed |\n| --- | --- | --- | --- |\n| P1 | A burst of file changes inside known checkouts (builds, worktree copies) leads to repeated **whole watched-folder scans**, although such changes can't alter which checkouts exist | the owner: CPU, disk, crash exposure | production telemetry: 59,151 `overflow_coarse` recoveries in 10 min during one worktree removal |\n| P2 | While a burst lasts, a folder is scanned back to back: each finished scan immediately starts its follow-up | the owner: sustained background work | fault-log ring: continuous scan cycling for 29 h |\n| P3 | Telemetry counts recovery records but not watched-folder scans started or completed, or why they started, so the waste can't be measured | the owner, when diagnosing | the `stage_outcome` records carry no scan identity or reason |\n\nDiscovery is correct today. The obligations below keep it that way; they don't introduce correctness.\n\n## Outcomes\n\n- **O1:** Changes that can't affect which checkouts exist in a watched folder start no scan of it, even when the intake is overloaded. (P1; U1, U2)\n- **O2:** A burst of relevant changes or lost events results in at most one scan per folder per quiet period, and never more often than the pacing allows. (P1, P2; U1, U3, U4)\n- **O3:** Every change that can affect membership, and every lost-event signal, is still reconciled by a scan within a bounded delay. (U7)\n- **O4:** Telemetry shows how many scans ran, for which folder and why, so the before and after can be compared. (P3; U5)\n\n## Entities\n\n```mermaid\nerDiagram\n  WATCHED_FOLDER ||--o{ KNOWN_CHECKOUT : \"contains (discovered)\"\n  WATCHED_FOLDER ||--o| RECOVERY_OBLIGATION : \"has at most one open\"\n  WATCHED_FOLDER ||--o{ SCAN : \"is reconciled by\"\n  FILE_CHANGE }o--|| WATCHED_FOLDER : \"observed under\"\n  FILE_CHANGE }o--o| KNOWN_CHECKOUT : \"falls inside (or not)\"\n  COVERAGE_LOSS }o--|{ WATCHED_FOLDER : \"affects\"\n  RECOVERY_OBLIGATION ||--o| SCAN : \"is closed by one covering\"\n```\n\n| ID | Term | Identity rule | Relationships | Invariants | Observable states | Replaces | Basis |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| E1 | **Watched folder** | One persisted watch on one canonical folder path. Removing the watch and adding it back creates a new watched folder. | contains 0..n known checkouts; has at most one open recovery obligation; reconciled by 0..n scans | A watched folder is reconciled only while it is persistently watched | watched → unwatched | \"watched root\", \"watched parent\", \"watched source\" | U7, contract 342-348 |\n| E2 | **Known checkout** | One repository checkout (clone or linked worktree) at one canonical root path, as last discovered in a watched folder | belongs to exactly 1 watched folder for this purpose | A path strictly inside a known checkout's root is \"inside the checkout\" | discovered → missing-pending-proof → absent (retention owns absence) | \"known root\", \"checkout\" | U7 |\n| E3 | **File change** | One path-level change notification as the OS reports it (path plus event); the same path changing twice is two file changes | observed under 1..n watched folders; falls inside 0..1 known checkout | Carries only what the OS reported; never invented | — | \"event\", \"FSEvent\" | U2 |\n| E4 | **Membership-relevant change** | A file change that can alter which checkouts exist in a watched folder: a Git marker appears or disappears, a known checkout or one of its ancestors moves or disappears, or a candidate directory appears **outside** every known checkout | a kind of file change | A change strictly inside a known checkout that isn't its Git marker isn't membership-relevant | — | \"topology change\" | contract 342-348 |\n| E5 | **Coverage loss** | One occurrence of lost or uncertain change history for a scope: the OS reporting dropped or must-rescan events, or intake discarding change detail | affects 1..n watched folders | Can never be filtered away as irrelevant, because what was lost is unknown | — | \"overflow\", \"drop\", \"MustScanSubDirs\" | U7; Apple FSEvents guide |\n| E6 | **Recovery obligation** | The one outstanding duty, per watched folder, to reconcile it after membership-relevant changes or coverage loss that no completed scan has yet covered | belongs to exactly 1 watched folder; closed by exactly 1 covering scan | At most one open per watched folder; further triggers fold into it; only a scan that **started after** the obligation's latest trigger closes it | open → scan pending → closed | \"rescan intent\", \"dirty follow-up\", \"recovery debt\" | U3, U7 |\n| E7 | **Scan** | One traversal run of one watched folder | reconciles 1 watched folder; may close 1 recovery obligation | At most one running per watched folder | queued → running → completed / cancelled / superseded | \"watched-folder scan\", \"rescan\" | U1 |\n| E8 | **Explicit scan demand** | A scan requested directly by the user or app lifecycle, not by file changes: adding a watched folder, a manual refresh, startup, or a retention check | targets 1 watched folder | Never delayed by pacing | — | \"manual/initial/retention demand\" | U7 (existing completion contracts) |\n\n## Requirements\n\n**R1. Irrelevant changes start no scan, even under overload.** When file changes under a watched folder are not membership-relevant (E4), the system must not start a scan (E7) of that watched folder because of them. This holds when the intake is overloaded and individual change details were discarded: losing detail for changes that were already known to be inside known checkouts must not turn them into a scan request. *Entities: E1, E2, E3, E4, E7. Basis: U1, U2, contract 342-348.*\n\n**R2. One recovery obligation per folder, kept until covered.** When membership-relevant changes or coverage loss occur for a watched folder, the system must hold exactly one open recovery obligation (E6) for it. Further triggers before a covering scan completes fold into that obligation and create no other. It closes only when a scan that started after its latest trigger completes. *Entities: E1, E4, E5, E6, E7. Basis: U3, U7.*\n\n**R3. Debounced pacing for change-driven scans.** While a recovery obligation is open, its scan must not start until (a) no new trigger for that folder has arrived for **2 seconds**, and (b) at least **2 seconds** have passed since that folder's previous scan completed. The only exception is (c) below, which ends the delay at 30 seconds. *Entities: E1, E6, E7. Basis: U3, U4.*\n\n**R4. Bounded delay: never starved.** (c) If the oldest unserved trigger of an open obligation is **30 seconds** old, its scan must become eligible without waiting for quiet. It is still limited by the existing per-folder single-flight and the global traversal limit, and by nothing else. *Entities: E1, E6, E7. Basis: U4, U7.*\n\n**R5. Lost events are always reconciled.** If coverage loss (E5) affects a watched folder, then the system must open or fold into its recovery obligation and reconcile it under R3 and R4. Coverage loss must never be discarded as irrelevant, whatever paths accompany it. *Entities: E1, E5, E6. Basis: U7, Apple FSEvents guide.*\n\n**R6. Explicit demands are not paced.** An explicit scan demand (E8) must keep its current behavior and timing. Pacing applies only to change-driven obligations, and an explicit demand's scan may close an open obligation it covers. *Entities: E6, E7, E8. Basis: U7.*\n\n**R7. Discovery stays correct.** Every membership-relevant change must be reflected in the published checkout set after the scan that covers it. Incomplete or deferred work must never publish absence. This keeps the existing negative-space and retention rules unchanged. *Entities: E1, E2, E4, E7. Basis: U7, contract 342-388.*\n\n**R8. Scans are observable.** For each watched-folder scan, telemetry must record: the folder (by a non-reversible tag, never a path), why it started (change-driven, coverage loss, or which explicit demand), when it started and completed, how long its obligation waited, and how many triggers folded into it. Records must keep distinguishing intake drops from OS-reported loss. *Entities: E1, E5, E6, E7. Basis: U5.*\n\n## Observable contract\n\n| Situation | What the user and the app observe |\n| --- | --- |\n| A worktree is created or removed inside a watched folder (100k+ file changes in seconds) | At most 2 scans of that watched folder start for the operation: the one its marker change triggers, after the 2 s quiet, plus at most one more if the burst outlasts the 30 s bound. The new or removed worktree shows up within about 2–30 s after its marker changed, plus the scan's own duration. |\n| A build writes heavily inside a known checkout | No scan of the watched folder starts. |\n| A burst runs continuously for 10 minutes and keeps creating new checkouts | Scans run about every 30 s (R4), not back to back. Each one reflects the checkouts that exist when it runs. |\n| The OS reports dropped events | One reconciliation scan, paced by R3 and R4. It's never skipped. |\n| The user adds a watched folder or refreshes manually | Same timing as today (R6). |\n| The folder is unwatched while an obligation is open | The obligation is dropped with the watch. Nothing is published for the removed watch. |\n\n**Negative space:**\n- There's no promise that a sub-second change appears in the sidebar within less than 2 s.\n- There's no promise of ordering across different watched folders.\n- There's no change to Git working-tree status refresh behavior.\n- There's no promise about how many file changes the intake can absorb. The promise is about scans.\n\n## Cross-cutting obligations\n\n- **Performance:** for the worktree create/remove workload, watched-folder scans per operation are at most 2 (R1–R4). Compared with the v0.0.124 baseline on the same workload, coarse watched-folder recoveries must drop by at least 90%.\n- **Reliability:** no coverage loss goes unreconciled (R5), and no obligation waits longer than 30 s plus single-flight queueing (R4).\n- **Privacy:** telemetry carries folder tags, never paths or file names (R8).\n- **Main thread:** none of this work may run on the main actor, under the existing performance-lane rule.\n- **Security, accessibility, compatibility:** not applicable. There's no new external surface, input or persisted format.\n\n## Proof obligations\n\n| ID | Obligation | Decides pass or fail | Reference |\n| --- | --- | --- | --- |\n| V1 | R1 | Under a saturated intake (drops forced, more than 256 distinct paths), changes strictly inside known checkouts start **0** scans of the watched folder. A new Git marker, a removed checkout root and a new candidate outside known checkouts each still start one. | contract 342-348 |\n| V2 | R2 | Many triggers, across many intake drains and while a scan is running, leave exactly one open obligation. A scan that started before the latest trigger does not close it. | R2 text |\n| V3 | R3 | With a controlled clock: a scan doesn't start before 2 s of quiet, or within 2 s of the previous scan's completion. | U4: \"min 2s\" |\n| V4 | R4 | With a controlled clock and a trigger every 1 s for 120 s: scans start at about 30 s intervals, with no gap over 30 s from the oldest unserved trigger, and no more than ⌈120/30⌉+1 scans in total. | U4: \"max 30\" |\n| V5 | R5 | An OS dropped-events signal accompanied only by paths inside known checkouts still results in exactly one paced scan. | Apple FSEvents guide; U7 |\n| V6 | R6 | Adding a folder and a manual refresh start their scans with the same timing as before the change. | current behavior |\n| V7 | R7 | A checkout created during a burst appears after the covering scan. A deferred or incomplete scan publishes no absence. | contract 342-388 |\n| V8 | R8 | Scan telemetry records the folder tag, reason, start, completion, obligation wait and folded-trigger count, with no paths. | U5 |\n| V9 | Performance | For the same worktree create/remove workload, at most 2 watched-folder scans per operation, and coarse recoveries at least 90% below the v0.0.124 baseline. | v0.0.124 telemetry, 2026-11-04 |\n\n## Requirement coverage\n\n| U | E | P | O | R | V |\n| --- | --- | --- | --- | --- | --- |\n| U1, U2 | E1 E2 E3 E4 E7 | P1 | O1 | R1 | V1, V9 |\n| U3, U7 | E1 E4 E5 E6 E7 | P1 P2 | O2 O3 | R2 | V2 |\n| U3, U4 | E1 E6 E7 | P2 | O2 | R3 | V3 |\n| U4, U7 | E1 E6 E7 | P2 | O2 O3 | R4 | V4 |\n| U7 | E1 E5 E6 | — | O3 | R5 | V5 |\n| U7 | E6 E7 E8 | — | O3 | R6 | V6 |\n| U7 | E1 E2 E4 E7 | — | O3 | R7 | V7 |\n| U5 | E1 E5 E6 E7 | P3 | O4 | R8 | V8 |\n| U6 | — | — | — | all | covered by delivery scope, not one obligation |\n","reference":"./2026-11-04-fsevents-overload-specification.md"}</script></ex-markdown>

  <section label="Verification Design">
    <ex-markdown id="verification-design" label="Verification Design"><script type="application/json" data-ex-markdown-source="">{"text":"# FSEvents overload: Verification Design\n\nPlans how [the Requirements](2026-11-04-fsevents-overload-requirements.md) are shown to hold. It uses the obligations and proof obligations in [the Specification](2026-11-04-fsevents-overload-specification.md) and the seams in [the Program Design trace table](2026-11-04-fsevents-overload-program-design.md#trace-table). This is a plan: nothing in it has been run or observed.\n\n## Proven by\n\n| Requirement | Proven by | Stays unverified |\n| --- | --- | --- |\n| **U1** \"don't do excess work walking the tree\" | In a debug build watching disposable repositories, create and remove a worktree inside a watched folder, then count that folder's scans in telemetry: **at most 2 per operation**, and coarse recoveries at least 90% below the v0.0.124 baseline on the same workload. | The owner's real 274-registration workspace isn't replayed; the fixture approximates it. |\n| **U2** \"don't look at files that don't matter\" | Feed bursts of more than 256 changes strictly inside a known checkout into a saturated intake: **no scan** of the watched folder starts. A new Git marker, a removed checkout and a new candidate folder each still start one. | — |\n| **U3** \"admission, then a debounce\" | Drive many triggers, including during a running scan, against a controlled clock: **one** pending obligation per folder, and a scan only after 2 s of quiet. | — |\n| **U4** \"min 2s, max 30\" | Against a controlled clock: no scan sooner than 2 s after the last change or the previous scan. Under a trigger every second for 2 minutes, a scan about every 30 s, never later. | Wall-clock timing on a loaded machine; the clock is controlled. |\n| **U5** \"add logging and tracing\" | The workload's telemetry shows each scan's folder tag, reason, start and completion, wait and folded-trigger count, **with no paths**. | — |\n| **U6** \"full change and design to properly fix this\" | Every row above and below passes on the delivered PR's head. The documents trace every obligation. | — |\n| **U7** discovery stays correct | A worktree created during a burst appears after the covering scan. Lost OS events still produce one scan. Adding a folder or refreshing is as immediate as before. Deferred work publishes no absence. | Nested-repository edge cases beyond the scanner's current rules (unchanged by this work). |\n\n## Coverage rows\n\n### Shared observation A: controlled-clock watched-folder actor\n\n`FilesystemActor` runs with `TestPushClock` and the existing fake stream client from `WatchedFolderActorFixture` (`Tests/AgentStudioTests/Core/PaneRuntime/Sources/FilesystemActorWatchedFolderTests.swift`). The fixture already lets tests send batches and overflow recoveries, and wait on admitted watched scans. What it observes: watched-scan submissions to the real `WatchedFolderScanScheduler`, the moments they happen on the controlled clock, and the recorded `watched_scan` telemetry through a recorder fake. It keeps real the actor, the pacing reducer, the topology rule and the scheduler. Only the OS stream and time are replaced. This is the boundary where a wrong pacing or routing build shows up. **Needed case additions:** the fixture must be constructible with `TestPushClock`, and it must expose a submission log with its clock times.\n\n### Shared observation B: watched-folder burst workload (performance)\n\n**`needed:` a lasting journey.** It's a sibling of `verify-git-refresh-performance-workload` (observability doc, \"Performance workload\"):\n- creates disposable fixture repositories and worktrees under one watched folder;\n- launches the declared debug build with `run-debug-observability`;\n- drives one worktree removal and one creation of at least 100k files;\n- queries marker-scoped VictoriaLogs and Metrics for `performance.filesystem.watched_scan` (by phase and reason) and `performance.filesystem.stage_outcome` coarse recoveries.\n\nThe same workload runs once against a v0.0.124 build to set the baseline. **Lifetime: lasting.** Any later change to ingress, admission or pacing can bring the storm back.\n\n| U | R | Seam | Observation | Target / journey or reused test | Passes when | Wrong build that fails it | Unverified |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| U1 U2 | R1 | `filterBatch` pure; stream client with injected stream factory and a capacity-1 buffer | the batches the client yields; the admitted scans in shared observation A | focused tests at `WatchedFolderTopologyAdmission` and `DarwinFSEventStreamClient`, plus A. Reuses `WatchedFolderTopologyAdmissionTests` (nested Git churn, held destinations, overflow cases at `:202-376`) and extends them over the snapshot. | For more than 256 distinct changes strictly inside a known checkout, the client yields nothing for the watched registration and 0 scans are admitted. A new `.git` marker, a removed checkout root and a new directory outside known checkouts each yield a batch and admit 1 scan. | a build that filters only accepted batches, so overflow still coarsens to a scan; a build that drops the checkout-root removal | the real kernel stream's event shapes beyond what the injected factory sends |\n| U3 U7 | R2 | pacing reducer; A | the obligation count per folder; which submitted scan closes it | focused reducer test, plus A | 50 triggers across 10 drains, during a running scan, give exactly 1 open obligation. A trigger after the submission keeps it open after the first scan completes, and exactly one more scan follows. | a build that closes the obligation on any scan completion (it loses the post-start trigger); a build that submits per trigger | — |\n| U3 U4 | R3 | reducer `decision(at:)`; A | the submission times on `TestPushClock` | focused reducer test, plus A | A trigger at t=0 with none after gives a submission at t=2 s, not before. With the previous scan completed at t=10, a trigger at t=9.5 gives a submission at t≥12 s. | an undebounced build that submits at t=0; a build ignoring the post-scan gap | wall-clock behavior under load |\n| U4 U7 | R4 | reducer forced branch; A | the submission times under a sustained burst | focused reducer test, plus A | With a trigger every 1 s for 120 s, submissions happen about every 30 s, at most ⌈120/30⌉+1 = 5 in total, and no unserved trigger is older than 30 s at any submission. With a submitted scan that never returns a result, the next forced submission still happens by 30 s. | a pure trailing debounce (0 scans during the burst); a build that waits forever on a lost result | — |\n| U7 | R5 | `filterBatch` keeps coverage loss; actor overflow path | admitted scans after a loss signal | focused test, plus A (extends `FilesystemActorWatchedFolderTests:11`) | A `UserDropped` observation whose only paths are inside known checkouts opens 1 obligation, giving 1 paced scan. A coarse intake recovery does the same. | a build that filters coverage loss as irrelevant | real `KernelDropped` timing from the OS |\n| U7 | R6 | actor explicit-submit path; A | submission times for `initialAdd` and `manual` | A | `initialAdd` and `manual` submit at the trigger time, t+0, and an open obligation is closed by that submission. | a build that paces explicit demands | — |\n| U7 | R7 | existing result application; A plus existing discovery integration tests | the published checkout set after the covering scan; absence publication | A, plus reuse of `WatchedFolderObservationCurrentnessTests`, `RepositoryNestedDiscoveryContinuityTests` and `WatchedFolderPublicationHoldIntegrationTests` (they drive real scans in temp repos) | A checkout created during a burst is published after the covering scan. No absence is published while an obligation is open. The existing discovery tests still pass unchanged. | a build that marks a checkout absent from a deferred or incomplete scan | — |\n| U5 | R8 | recorder fake in A; production-class Victoria in B | `watched_scan` attributes | A, plus B | Every submission and completion has the folder tag, reason, phase, wait in ms and folded count. No attribute value contains a path separator or a fixture name. | a build that logs paths; a build that records only submissions | — |\n| U1 | performance (V9) | B | watched-scan counts per operation; coarse recoveries vs baseline | B, against the debug build of the PR head and against v0.0.124 | At most 2 `watched_scan` phase `submitted` with reason `relevantChange` or `*CoverageLoss` per operation for the watched folder, and coarse recoveries at least 90% lower than the v0.0.124 run on the same fixture. | the current main (v0.0.124 behavior) | the owner's real workspace size; other volumes |\n| U6 | all | the documents and the PR | structural | the four documents' trace; the PR's gate run | Every R1–R8 row passes on the PR head and `mise run test` passes there. | — | — |\n\n### Tests whose expectations change\n\nThese are the existing tests that today assert an **immediate** scan after a callback or overflow, such as `FilesystemActorWatchedFolderTests` \"one ingress batch records multiple watched overflow admissions once\". They become paced expectations on `TestPushClock`. That's the intended behavior change (R3), not a weakened proof. Every such test keeps its scan-count assertion, now taken after the pacing deadline.\n","reference":"./2026-11-04-fsevents-overload-verification-design.md"}</script></ex-markdown>
